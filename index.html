<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Painel Segurança do Trabalho</title>
    <!-- CORRIGIDO: Removido link inseguro que bloqueava o carregamento dos scripts dinâmicos -->
    <style>
        * {

            padding: 0;

        }

        body {

            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {

            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 3vh;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 1.5vh 4vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 4.5vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;

        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;

            margin-top: 0.5vh;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 2vh;
            font-weight: 900;
            color: #ffffff;

            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 44vw;
            height: 32vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 3vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* ALTERADO: Tamanho da fonte dos números digitais maximizado ao limite do quadro */
        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 19vh;
            font-weight: bold;
            line-height: 0.8;
            letter-spacing: -2px;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* ALTERADO: Rodapé adaptado para 4 caixas pretas estilizadas lado a lado */
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 1vh 0;
            gap: 1.5vw;
        }

        .caixa-info-preta-rodape {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            flex: 1;
            height: 16vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5vh 10px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .caixa-info-preta-rodape p {
            font-family: 'Arial', sans-serif;
            font-size: 1.8vh;
            color: #a2b4c7;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5vh;
            letter-spacing: 1px;
        }

        /* ALTERADO: Tamanho de fonte maximizado ao limite visível para os resultados do rodapé */
        .caixa-info-preta-rodape h3 {
            font-family: 'Arial', sans-serif;
            font-size: 6.2vh;
            color: #ffffff; /* Mudado para branco para brilhar e contrastar com o fundo escuro */
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>

    <!-- Bloco Superior -->
    <div class="container-principal">
        
        <!-- Título -->
        <header class="caixa-titulo-preta">

            <div class="subtitulo-container">

                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar com Contagem Automática -->
        <main class="grid-contadores">
            <div class="painel-contador">

                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>

            </div>
        </main>

    </div>

    <!-- ALTERADO: Rodapé reestruturado proporcionalmente com caixas pretas independentes -->
    <footer>
        <div class="caixa-info-preta-rodape">
            <p>Semana Atual</p>
            <h3 id="semana-campo">34ª Semana</h3>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Data</p>
            <h3 id="data-campo">--/--/----</h3>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>São Luís - MA</p>
            <h3 id="temp-campo">--°C</h3>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Horário</p>
            <h3 id="relogio-campo">--:--:--</h3>
        </div>
    </footer>

    <!-- Scripts de Atualização Autônomos Completos -->
    <script>
        function calcularDias() {
            try {
                const dataInicial = new Date(2024, 10, 25); // 25/11/2024 (Mês no JS começa em 0)
                const dataAtual = new Date();
                
                dataInicial.setHours(0, 0, 0, 0);
                dataAtual.setHours(0, 0, 0, 0);
                
                const diferencaTempo = dataAtual.getTime() - dataInicial.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
                
                if (diferencaDias >= 0) {
                    document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                    document.getElementById('nosso-recorde').textContent = diferencaDias;
                }
            } catch (e) { console.error("Erro ao calcular dias:", e); }
        }

        // Lógica automática para somar +1 na contagem de semanas em todas as segundas-feiras
        function calcularSemanas() {
            try {
                const dataAtual = new Date();
                const dataBaseSegunda = new Date(2026, 7, 17); // Segunda-feira fixada como referência da 34ª semana
                dataBaseSegunda.setHours(0, 0, 0, 0);
                
                const hoje = new Date(dataAtual.getTime());
                hoje.setHours(0, 0, 0, 0);
                
                const diferencaTempo = hoje.getTime() - dataBaseSegunda.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
                
                const semanasPassadas = Math.floor(diferencaDias / 7);
                const semanaAtual = 34 + semanasPassadas;
                
                document.getElementById('semana-campo').textContent = `${semanaAtual}ª Semana`;
            } catch (e) { console.error("Erro ao calcular semanas:", e); }
        }
