<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .painel-fundo {
            width: 100vw;
            height: 100vh;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Área central dos grandes contadores */
        .conteudo-displays {
            position: absolute;
            top: 17.2%;
            left: 23.6%;
            width: 52.8%;
            height: 61.6vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .quadro-display {
            width: 100%;
            height: 29.3vh;
            background-color: #061325;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 0 1.2vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 3.5px solid #0f243d;
        }

        .borda-verde {
            border: 3.5px solid #08221a;
        }

        .titulo-interno {
            color: #ffffff;
            font-size: 2.8vh;
            font-weight: 700;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* FONTE DIGITAL SEGMENTADA VIA CSS: Cantos retos e visual de relógio eletrônico */
        .contador-led {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 24vh; 
            font-weight: 900;
            letter-spacing: 12px; /* Espaço entre os dígitos para simular blocos de LED */
            line-height: 0.75;
            text-align: center;
            width: 100%;
        }

        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 25px rgba(255, 17, 34, 0.8);
        }

        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 25px rgba(0, 255, 85, 0.8);
        }

        /* ALINHAMENTO DO RODAPÉ: Subido para liberar totalmente as palavras fixas de baixo */
        .texto-dinamico-rodape {
            font-family: 'Impact', 'Arial Black', sans-serif; /* Fonte robusta e quadrada para a data/hora */
            font-size: 4vh;
            font-weight: 900;
            color: #0d2343;
            position: absolute;
            bottom: 13.5%; /* Movido mais para cima para desgrudar dos textos "DATA" e "HORÁRIO" */
            height: 5vh;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            z-index: 20;
        }

        /* Posição horizontal milimétrica ao lado do ícone do calendário */
        .posicao-data {
            left: 16.5%;
            width: 15%;
        }

        /* Posição horizontal milimétrica ao lado do ícone do relógio azul */
        .posicao-hora {
            right: 8.5%;
            width: 15%;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <!-- Displays Principais -->
        <div class="conteudo-displays">
            <div class="quadro-display">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho" id="num-dias">609</div>
            </div>
            
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde" id="num-recorde">609</div>
            </div>
        </div>

        <!-- Campos de Texto reposicionados para cima -->
        <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
        <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">13:38:13</div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualiza data
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualiza hora
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
