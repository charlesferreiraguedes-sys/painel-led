<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            color: #0c2340;
            overflow: hidden;
        }

        /* Topo e Título Modificados */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #142847;
            padding: 15px 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.4);
        }

        .caixa-titulo-preta h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitulo {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ff66; /* Verde destacado para contrastar no fundo preto */
            letter-spacing: 3px;
            margin-top: 5px;
        }

        /* Conteúdo Central - Placar Próximo ao Título */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px; /* Reduzido para aproximar as caixas */
            margin-top: -10px; 
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 700px;
            padding: 15px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            color: #ffffff;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé de Informações Duplicado de Tamanho */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 50px; /* Espaçamento interno dobrado */
            border: 3px solid #0c2340;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 25px; /* Espaço ampliado */
        }

        .icone {
            font-size: 4rem; /* Ícones duas vezes maiores */
        }

        .texto-info p {
            font-size: 1.3rem; /* Textos de legenda ampliados */
            color: #5d6d7e;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .texto-info h3 {
            font-size: 2.8rem; /* Valores (Data/Hora/Clima) duas vezes maiores */
            color: #0c2340;
            font-weight: 900;
        }

        .mensagem-centro {
            text-align: center;
            max-width: 35%;
        }

        .mensagem-centro h3 {
            font-size: 1.6rem; /* Slogan central ampliado */
            color: #0c2340;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <!-- Topo com Caixa Preta -->
    <header>
        <div class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo">CUIDAR HOJE PARA PROTEGER SEMPRE</div>
        </div>
    </header>

    <!-- Placar Central Mais Próximo -->
    <main>
        <!-- Dias Sem Acidentes -->
        <div class="painel-contador">
            <h2>Dias Sem Acidentes</h2>
            <div class="numero-digital vermelho">611</div>
        </div>

        <!-- Nosso Recorde -->
        <div class="painel-contador">
            <h2>Nosso Recorde</h2>
            <div class="numero-digital verde">611</div>
        </div>
    </main>

    <!-- Rodapé com Tamanho Dobrado e Temperatura Online -->
    <footer>
        <!-- Data -->
        <div class="bloco-info">
            <div class="icone">📅</div>
            <div class="texto-info">
                <p>Data</p>
                <h3 id="data-campo">29/07/2026</h3>
            </div>
        </div>

        <!-- Temperatura de São Luís Online -->
        <div class="bloco-info">
            <div class="icone">☀️</div>
            <div class="texto-info">
                <p>São Luís - MA</p>
                <h3 id="temp-campo">28°C</h3> <!-- Temperatura atual registrada localmente -->
            </div>
        </div>

        <!-- Horário (Atualizado por Script) -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <p>Horário</p>
                <h3 id="relogio-campo">08:53:00</h3>
            </div>
        </div>
    </footer>

    <!-- Script para Relógio em Tempo Real e Data Atualizada -->
    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualiza o Relógio
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;
            
            // Atualiza a Data automaticamente caso vire o dia
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;
        }

        // Script integrado para buscar a temperatura real via API pública (Open-Meteo)
        async function buscarTemperaturaOnline() {
            try {
                // Coordenadas aproximadas de Anjo da Guarda, São Luís - MA
                const response = await fetch('https://open-meteo.com');
                const data = await response.json();
                if (data && data.current_weather) {
                    const tempArredondada = Math.round(data.current_weather.temperature);
                    document.getElementById('temp-campo').textContent = `${tempArredondada}°C`;
                }
            } catch (error) {
                console.log("Erro ao carregar dados de temperatura online, mantendo padrão.");
            }
        }

        // Execuções automáticas
        setInterval(atualizarPainel, 1000);
        atualizarPainel();
        buscarTemperaturaOnline();
        
        // Atualiza a temperatura da API a cada 15 minutos
        setInterval(buscarTemperaturaOnline, 900000);
    </script>

</body>
</html>
