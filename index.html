<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2vw;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 3vh;
            width: 100%;
            margin-top: 15vh; /* ALTERADO: Moveu todo o bloco superior para baixo uniformemente */
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 1.5vh 4vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 4.5vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 0.5vh;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 2vh;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 44vw;
            height: 32vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5vh 15px 1.5vh 15px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 3vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Arial', sans-serif;
            font-size: 12rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé de Caixas Pretas */
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 1vh 0;
            gap: 1.5vw;
        }

        .caixa-info-preta-rodape {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            flex: 1;
            height: 16vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5vh 10px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        /* ALTERADO: Cor alterada para branco puro (#ffffff) para dar máximo destaque */
        .caixa-info-preta-rodape p {
            font-family: 'Arial', sans-serif;
            font-size: 1.8vh;
            color: #ffffff; 
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5vh;
            letter-spacing: 1px;
        }

        .resultado-gigante-rodape {
            font-family: 'Arial', sans-serif;
            font-size: 6.2vh;
            color: #ffffff; 
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar Eletrônico -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>
    </div>

    <!-- Rodapé Automatizado -->
    <footer>
        <div class="caixa-info-preta-rodape">
            <p>Semana Atual</p>
            <div id="semana-campo" class="resultado-gigante-rodape">--ª Semana</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Data</p>
            <div id="data-campo" class="resultado-gigante-rodape">--/--/----</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>São Luís - MA</p>
            <div id="temp-campo" class="resultado-gigante-rodape">Buscando...</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Horário</p>
            <div id="relogio-campo" class="resultado-gigante-rodape">--:--:--</div>
        </div>
    </footer>

    <script>
        // ============================================================
        // TEMPERATURA AUTOMÁTICA PELA LOCALIZAÇÃO REAL
        // Usa GPS/localização do navegador + Open-Meteo.
        // A temperatura é atualizada a cada 5 minutos.
        // Relógio, data e contadores continuam independentes.
        // ============================================================
        // ============================================================
        // TEMPERATURA AUTOMÁTICA - LOCALIZAÇÃO + FALLBACK
        // Primeiro tenta a localização real do dispositivo.
        // Se o navegador não liberar GPS/localização, usa as coordenadas
        // padrão de São Luís-MA para o painel não ficar sem temperatura.
        // ============================================================
        let ultimaConsultaClima = 0;
        const INTERVALO_CLIMA = 5 * 60 * 1000;

        // São Luís - MA (fallback)
        const LATITUDE_PADRAO = -2.5297;
        const LONGITUDE_PADRAO = -44.3028;

        async function consultarTemperatura(latitude, longitude) {
            try {
                const url =
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}` +
                    `&longitude=${longitude}` +
                    `&current=temperature_2m` +
                    `&temperature_unit=celsius` +
                    `&timezone=auto`;

                const resposta = await fetch(url, {
                    cache: "no-store",
                    mode: "cors"
                });

                if (!resposta.ok) {
                    throw new Error(`HTTP ${resposta.status}`);
                }

                const dados = await resposta.json();

                if (dados.current &&
                    typeof dados.current.temperature_2m === "number") {

                    document.getElementById('temp-campo').textContent =
                        `${dados.current.temperature_2m.toFixed(1)}°C`;

                    ultimaConsultaClima = Date.now();
                    return true;
                }

            } catch (erro) {
                console.error("Erro na consulta da temperatura:", erro);
            }

            return false;
        }

        function atualizarTemperaturaPorLocalizacao() {

            // Se houver geolocalização, tenta primeiro a posição real.
            if (navigator.geolocation) {

                navigator.geolocation.getCurrentPosition(
                    async function(posicao) {

                        const sucesso = await consultarTemperatura(
                            posicao.coords.latitude,
                            posicao.coords.longitude
                        );

                        // Caso a API/localização falhe, mantém o painel funcionando.
                        if (!sucesso) {
                            await consultarTemperatura(
                                LATITUDE_PADRAO,
                                LONGITUDE_PADRAO
                            );
                        }
                    },

                    async function(erro) {
                        console.warn(
                            "Localização não autorizada ou indisponível. " +
                            "Usando São Luís-MA como referência."
                        );

                        await consultarTemperatura(
                            LATITUDE_PADRAO,
                            LONGITUDE_PADRAO
                        );
                    },

                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 300000
                    }
                );

            } else {
                // Navegador sem geolocalização.
                consultarTemperatura(
                    LATITUDE_PADRAO,
                    LONGITUDE_PADRAO
                );
            }
        }

        // Função unificada executada sem atrasos
        function rodarPainelCompleto() {
            try {
                const agora = new Date();

                // 1. Relógio atualizado segundo a segundo
                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0');
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;

                // 2. Data corrente
                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;

                // 3. Dias Sem Acidente e Recorde baseados em 25/11/2024
                const dataInicial = new Date(2024, 10, 25);
                dataInicial.setHours(0, 0, 0, 0);
                const hojeZerado = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const diferencaDias = Math.floor(
                    (hojeZerado.getTime() - dataInicial.getTime()) /
                    (1000 * 60 * 60 * 24)
                );

                if (diferencaDias >= 0) {
                    document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                    document.getElementById('nosso-recorde').textContent = diferencaDias;
                }

                // 4. Contador de semanas (Base fixa: 17/08/2026 = 34ª Semana)
                const dataBaseSegunda = new Date(2026, 7, 17);
                dataBaseSegunda.setHours(0, 0, 0, 0);
                const diferencaIdadeSemanas = Math.floor(
                    (hojeZerado.getTime() - dataBaseSegunda.getTime()) /
                    (1000 * 60 * 60 * 24 * 7)
                );
                const semanaAtual = 34 + diferencaIdadeSemanas;
                document.getElementById('semana-campo').textContent =
                    `${semanaAtual}ª Semana`;

                // 5. Temperatura automática.
                // Só consulta a API quando passaram 5 minutos.
                if (Date.now() - ultimaConsultaClima >= INTERVALO_CLIMA) {
                    atualizarTemperaturaPorLocalizacao();
                }

            } catch (e) {
                console.error("Erro na automação do painel:", e);
            }
        }

        // Execução imediata ao carregar os elementos na tela
        rodarPainelCompleto();

        // Loop ativo de 1 em 1 segundo
        setInterval(rodarPainelCompleto, 1000);
    </script>
</body>
</html>
