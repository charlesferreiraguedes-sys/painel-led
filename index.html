<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 20px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 480px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé Transparente */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 15px 20px;
            border: none;
            box-shadow: none;
        }

        .grupo-esquerdo {
            display: flex;
            flex-direction: row;
            gap: 50px;
            align-items: center;
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8), -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        .icone {
            font-size: 4.5rem;
        }

        .texto-info p {
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .texto-info h3 {
            font-family: 'Arial', sans-serif;
            font-size: 3.5rem;
            color: #0c2340;
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar com Contagem Automática -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">633</div>
            </div>
            
            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">633</div>
            </div>
        </main>
    </div>

    <!-- Rodapé -->
    <footer>
        <div class="grupo-esquerdo">
            <!-- Caixa de Semanas -->
            <div class="bloco-info">
                <div class="icone">🗓️</div>
                <div class="texto-info">
                    <p>Semana Atual</p>
                    <h3 id="semana-campo">34ª Semana</h3>
                </div>
            </div>

            <!-- Data -->
            <div class="bloco-info">
                <div class="icone">📅</div>
                <div class="texto-info">
                    <p>Data</p>
                    <h3 id="data-campo">20/08/2026</h3>
                </div>
            </div>

            <!-- Clima Local Real -->
            <div class="bloco-info">
                <div id="clima-icone" class="icone">☀️</div>
                <div class="texto-info">
                    <p>São Luís - MA</p>
                    <h3 id="temp-campo">28°C</h3>
                </div>
            </div>
        </div>

        <!-- Horário -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <p>Horário</p>
                <h3 id="relogio-campo">16:23:00</h3>
            </div>
        </div>
    </footer>

    <script>
        function calcularDias() {
            try {
                const dataInicial = new Date(2024, 10, 25); // 25/11/2024
                const dataAtual = new Date();

                dataInicial.setHours(0, 0, 0, 0);
                dataAtual.setHours(0, 0, 0, 0);

                const diferencaTempo = dataAtual.getTime() - dataInicial.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));

                if (diferencaDias >= 0) {
                    document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                    document.getElementById('nosso-recorde').textContent = diferencaDias;
                }
            } catch (e) { console.error(e); }
        }

        function calcularSemanas() {
            try {
                const dataAtual = new Date();
                const dataBaseSegunda = new Date(2026, 7, 17); 
                dataBaseSegunda.setHours(0, 0, 0, 0);
                
                const hoje = new Date(dataAtual.getTime());
                hoje.setHours(0, 0, 0, 0);
                
                const diferencaTempo = hoje.getTime() - dataBaseSegunda.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
                
                const semanasPassadas = Math.floor(diferencaDias / 7);
                const semanaAtual = 34 + semanasPassadas;
                
                document.getElementById('semana-campo').textContent = `${semanaAtual}ª Semana`;
            } catch (e) { console.error(e); }
        }

        function atualizarPainel() {
            try {
                const agora = new Date();

                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0'); // CORRIGIDO: Nome unificado em português
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;

                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;
            } catch (e) { console.error(e); }
        }

        function atualizarClimaReal() {
            try {
                const lat = -2.53073;
                const lon = -44.3068;
                const url = `https://open-meteo.com{lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=America/Fortaleza`;

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.current) {
                            const tempArredondada = Math.round(data.current.temperature_2m);
