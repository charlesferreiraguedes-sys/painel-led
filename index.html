<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Segurança</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:'Orbitron',sans-serif;
    overflow:hidden;
}

.container{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:space-evenly;

    align-items:center;
}

h1{

    font-size:60px;

    color:white;

}

.titulo{

    color:white;

    font-size:38px;

    text-align:center;

    margin-bottom:10px;

}

.numero{

    font-size:180px;

    text-align:center;

    color:#ff0000;

    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 35px red,
        0 0 60px red;

}

.recorde{

    font-size:180px;

    text-align:center;

    color:#00ff00;

    text-shadow:
        0 0 10px lime,
        0 0 20px lime,
        0 0 35px lime,
        0 0 60px lime;

}

.rodape{

    width:90%;

    display:flex;

    justify-content:space-between;

    font-size:40px;

    color:white;

}

</style>

</head>

<body>

<div class="container">

<h1>SEGURANÇA DO TRABALHO</h1>

<div>

<div class="titulo">

DIAS SEM ACIDENTES

</div>

<div class="numero" id="dias">

0

</div>

</div>

<div>

<div class="titulo">

NOSSO RECORDE

</div>

<div class="recorde" id="recorde">

412

</div>

</div>

<div class="rodape">

<div id="data"></div>

<div id="hora"></div>

</div>

</div>

<script>

const ultimoAcidente = new Date("2024-11-25");

const recorde = 412;

function atualizar(){

    const agora = new Date();

    let dias = Math.floor(
        (agora - ultimoAcidente)/(1000*60*60*24)
    );

    if(dias<0){
        dias=0;
    }

    document.getElementById("dias").innerHTML=dias;

    document.getElementById("recorde").innerHTML=recorde;

    document.getElementById("hora").innerHTML=
        agora.toLocaleTimeString("pt-BR");

    document.getElementById("data").innerHTML=
        agora.toLocaleDateString("pt-BR");

}

atualizar();

setInterval(atualizar,1000);

</script>

</body>

</html>
