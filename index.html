<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- CORRIGIDO: Links das fontes do Google corrigidos para evitar bloqueios de segurança -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .painel-fundo {
            width: 100vw;
            height: 100vh;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        /* Área central dos grandes contadores */
        .conteudo-displays {
            position: absolute;
            top: 17.2%;
            left: 23.6%;
            width: 52.8%;
            height: 61.6vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }
        .quadro-display {
            width: 100%;
            height: 29.3vh;
            background-color: #061325;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 0 1.2vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 3.5px solid #0f243d;
        }
        .borda-verde {
            border: 3.5px solid #08221a;
        }
        .titulo-interno {
            color: #ffffff;
            font-size: 2.8vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* Fonte digital com os segmentos retos */
        .contador-led {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 25vh;
            font-weight: 700;
            letter-spacing: -4px;
            line-height: 0.75;
            text-align: center;
            width: 100%;
            transform: scaleY(1.15);
        }
        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 25px rgba(255, 17, 34, 0.7);
        }
        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 25px rgba(0, 255, 85, 0.7);
        }
        /* Estilo comum para as caixas de texto do rodapé */
        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.4vh; /* Mantém o padrão do seu layout */
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 13.8%; /* Altura estável acima das palavras cinzas */
            height: 5vh;
            display: flex;
            align-items: center;
            z-index: 20;
            white-space: nowrap;
        }
        /* ADICIONADO: Posições horizontais exatas no vão do seu arquivo de fundo */
        .posicao-semana {
            left: 2.8%;
        }
        .posicao-data {
            left: 22.0%;
        }
        .posicao-clima {
            left: 41.5%;
        }
        .posicao-hora {
            left: 81.0%;
        }
    </style>
</head>
<body>
    <div class="painel-fundo">
        <!-- Displays Principais -->
        <div class="conteudo-displays">
            <div class="quadro-display">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho" id="num-dias">0</div>
            </div>
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde" id="num-recorde">609</div>
            </div>
        </div>
        
        <!-- ADICIONADO: Caixas do Rodapé no local do retângulo vermelho -->
        <div class="texto-dinamico-rodape posicao-semana" id="txt-semana">--ª Semana</div>
        <div class="texto-dinamico-rodape posicao-data" id="txt-data">--/--/----</div>
        <div class="texto-dinamico-rodape posicao-clima" id="txt-clima">--°C</div>
        <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">--:--:--</div>
    </div>

    <script>
        // Configurações da lógica do painel
        const DATA_INICIAL = new Date('2024-11-25T00:00:00');
        const RECORDE_HISTORICO_BASE = 609;
        const DATA_BASE_34_SEMANA = new Date('2026-08-17T00:00:00'); // Segunda-feira de base para a 34ª semana

        function atualizarPainel() {
            try {
                const agora = new Date();

                // 1. Atualiza data do rodapé
                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;

                // 2. Atualiza hora do rodapé
                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0');
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;

                // 3. Calcula a diferença em dias inteiros sem acidentes
                const hojeZerado = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const dataInicZerada = new Date(DATA_INICIAL.getFullYear(), DATA_INICIAL.getMonth(), DATA_INICIAL.getDate());
                const diferencaTempo = hojeZerado.getTime() - dataInicZerada.getTime();
                const diasSemAcidentes = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));

                // Atualiza o visor de dias atuais na tela
                document.getElementById('num-dias').textContent = diasSemAcidentes;

                // Mantém o recorde antigo ou acompanha os dias atuais caso ultrapasse
                const maiorRecorde = Math.max(RECORDE_HISTORICO_BASE, diasSemAcidentes);
                document.getElementById('num-recorde').textContent = maiorRecorde;

                // 4. Calcula o número de semanas (Avança automaticamente toda segunda-feira)
                const baseSegundaZerada = new Date(DATA_BASE_34_SEMANA.getFullYear(), DATA_BASE_34_SEMANA.getMonth(), DATA_BASE_34_SEMANA.getDate());
                const diferencaSemanasTempo = hojeZerado.getTime() - baseSegundaZerada.getTime();
                const semanasPassadas = Math.floor(diferencaSemanasTempo / (1000 * 60 * 60 * 24 * 7));
                const semanaAtual = 34 + semanasPassadas;
                document.getElementById('txt-semana').textContent = `${semanaAtual}ª Semana`;

            } catch (e) { console.error("Erro na atualização síncrona do painel:", e); }
        }

        // 5. Clima Real Dinâmico de São Luís via API Pública Open-Meteo
        function atualizarClimaReal() {
            try {
                const url = `https://open-meteo.com`;
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.current) {
                            const tempArredondada = Math.round(data.current.temperature_2m);
                            document.getElementById('txt-clima').textContent = `${tempArredondada}°C`;
                        }
                    })
                    .catch(() => {
                        // Fallback estável offline se a internet cair
                        const hora = new Date().getHours();
                        const tempSimulada = (hora >= 18 || hora < 6) ? 26 : 29;
                        document.getElementById('txt-clima').textContent = `${tempSimulada}°C`;
                    });
            } catch (e) { console.error("Erro ao processar API de clima:", e); }
        }

        // Executa as rotinas de tempo contínuas protegidas
        atualizarPainel();
        atualizarClimaReal();

        setInterval(atualizarPainel, 1000);       // Relógio corre segundo a segundo
        setInterval(atualizarClimaReal, 900000);   // Atualiza os termômetros ao vivo a cada 15 minutos
    </script>
</body>
</html>
