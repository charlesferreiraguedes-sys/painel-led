<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2vw;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 3vh;
            width: 100%;
            margin-top: 15vh; /* ALTERADO: Moveu todo o bloco superior para baixo uniformemente */
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 1.5vh 4vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 4.5vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 0.5vh;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 2vh;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 44vw;
            height: 32vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5vh 15px 1.5vh 15px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 3vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Arial', sans-serif;
            font-size: 12rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé de Caixas Pretas */
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 1vh 0;
            gap: 1.5vw;
        }

        .caixa-info-preta-rodape {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            flex: 1;
            height: 16vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5vh 10px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        /* ALTERADO: Cor alterada para branco puro (#ffffff) para dar máximo destaque */
        .caixa-info-preta-rodape p {
            font-family: 'Arial', sans-serif;
            font-size: 1.8vh;
            color: #ffffff; 
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5vh;
            letter-spacing: 1px;
        }

        .resultado-gigante-rodape {
            font-family: 'Arial', sans-serif;
            font-size: 6.2vh;
            color: #ffffff; 
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
    
@keyframes entradaPainel{from{opacity:0;transform:translateY(35px) scale(.96);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes brilhoBorda{0%,100%{box-shadow:0 10px 20px rgba(0,0,0,.3)}50%{box-shadow:0 10px 25px rgba(0,0,0,.45),0 0 18px rgba(0,100,55,.22)}}
@keyframes linhaVerde{0%,100%{transform:scaleX(.65);opacity:.55}50%{transform:scaleX(1);opacity:1}}
@keyframes numeroRespira{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes brilhoVerde{0%,100%{text-shadow:0 0 18px rgba(0,255,102,.45)}50%{text-shadow:0 0 32px rgba(0,255,102,.85)}}
@keyframes brilhoVermelho{0%,100%{text-shadow:0 0 18px rgba(255,26,26,.45)}50%{text-shadow:0 0 30px rgba(255,26,26,.78)}}
@keyframes atualizaValor{0%{opacity:.35;transform:scale(.94);filter:blur(3px)}60%{opacity:1;transform:scale(1.035);filter:blur(0)}100%{opacity:1;transform:scale(1)}}
@keyframes temperaturaMudou{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.10);filter:brightness(1.55)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes relogioTick{0%{opacity:.72}50%{opacity:1}100%{opacity:.92}}
.efeito-luz{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0;opacity:.20}
.container-principal,footer{position:relative;z-index:2}
.caixa-titulo-preta{animation:entradaPainel .9s ease-out both,brilhoBorda 5s ease-in-out infinite 1s}
.painel-contador{animation:entradaPainel 1s ease-out both,brilhoBorda 4s ease-in-out infinite 1.2s}
.painel-contador:nth-child(2){animation-delay:.18s,1.4s}
.caixa-info-preta-rodape{animation:entradaPainel .8s ease-out both,brilhoBorda 5s ease-in-out infinite 1.8s}
.caixa-info-preta-rodape:nth-child(1){animation-delay:.30s,2s}
.caixa-info-preta-rodape:nth-child(2){animation-delay:.42s,2.2s}
.caixa-info-preta-rodape:nth-child(3){animation-delay:.54s,2.4s}
.caixa-info-preta-rodape:nth-child(4){animation-delay:.66s,2.6s}
.linha-verde{transform-origin:center;animation:linhaVerde 2.8s ease-in-out infinite}
.numero-digital{animation:numeroRespira 4s ease-in-out infinite}
.vermelho{animation:numeroRespira 4s ease-in-out infinite,brilhoVermelho 3.5s ease-in-out infinite}
.verde{animation:numeroRespira 4s ease-in-out infinite,brilhoVerde 3.5s ease-in-out infinite}
#relogio-campo{font-variant-numeric:tabular-nums;animation:relogioTick 1s ease-in-out infinite}
.valor-atualizado{animation:atualizaValor .55s cubic-bezier(.2,.8,.2,1)}
.temperatura-alterada{animation:temperaturaMudou .85s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

    </style>
</head>
<body>
<svg class="efeito-luz" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
<defs><radialGradient id="brilhoSvg"><stop offset="0%" stop-opacity=".75"/><stop offset="100%" stop-opacity="0"/></radialGradient></defs>
<circle cx="180" cy="180" r="180" fill="url(#brilhoSvg)"><animate attributeName="cx" values="180;300;180" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="180;260;180" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1420" cy="720" r="220" fill="url(#brilhoSvg)"><animate attributeName="cx" values="1420;1280;1420" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="720;610;720" dur="11s" repeatCount="indefinite"/></circle>
</svg>

    <!-- Bloco Superior -->
    <div class="container-principal">
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar Eletrônico -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>
    </div>

    <!-- Rodapé Automatizado -->
    <footer>
        <div class="caixa-info-preta-rodape">
            <p>Semana Atual</p>
            <div id="semana-campo" class="resultado-gigante-rodape">--ª Semana</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Data</p>
            <div id="data-campo" class="resultado-gigante-rodape">--/--/----</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>São Luís - MA</p>
            <div id="temp-campo" class="resultado-gigante-rodape">--°C</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Horário</p>
            <div id="relogio-campo" class="resultado-gigante-rodape">--:--:--</div>
        </div>
    </footer>

    <script>

function definirValorAnimado(id,valor,tipo="normal"){
 const e=document.getElementById(id); if(!e)return;
 const v=String(valor);
 if(e.textContent!==v){
  e.textContent=v;
  e.classList.remove("valor-atualizado","temperatura-alterada");
  void e.offsetWidth;
  e.classList.add(tipo==="temperatura"?"temperatura-alterada":"valor-atualizado");
 }
}

        // Função unificada executada sem atrasos
        function rodarPainelCompleto() {
            try {
                const agora = new Date();
                
                // 1. Relógio atualizado segundo a segundo
                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0');
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                definirValorAnimado('relogio-campo', `${horas}:${minutos}:${segundos}`);
                
                // 2. Data corrente
                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                definirValorAnimado('data-campo', `${dia}/${mes}/${ano}`);
                
                // 3. Dias Sem Acidente e Recorde baseados em 25/11/2024
                const dataInicial = new Date(2024, 10, 25);
                dataInicial.setHours(0, 0, 0, 0);
                const hojeZerado = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const diferencaDias = Math.floor((hojeZerado.getTime() - dataInicial.getTime()) / (1000 * 60 * 60 * 24));
                
                if (diferencaDias >= 0) {
                    definirValorAnimado('dias-sem-acidente', diferencaDias);
                    definirValorAnimado('nosso-recorde', diferencaDias);
                }

                // 4. Contador de semanas (Base fixa: 17/08/2026 = 34ª Semana)
                const dataBaseSegunda = new Date(2026, 7, 17);
                dataBaseSegunda.setHours(0, 0, 0, 0);
                const diferencaIdadeSemanas = Math.floor((hojeZerado.getTime() - dataBaseSegunda.getTime()) / (1000 * 60 * 60 * 24 * 7));
                const semanaAtual = 34 + diferencaIdadeSemanas;
                definirValorAnimado('semana-campo', `${semanaAtual}ª Semana`);

                // 5. Clima Inteligente Automático baseado no horário local
                let temperatura = 28;
                const horaAtual = agora.getHours();
                if (horaAtual >= 18 || horaAtual < 6) {
                    temperatura = 26; 
                } else if (horaAtual >= 11 && horaAtual < 15) {
                    temperatura = 31;
                }
                definirValorAnimado('temp-campo', `${temperatura}°C`, 'temperatura');

            } catch (e) { console.error("Erro na automação do painel:", e); }
        }

        // Execução imediata ao carregar os elementos na tela
        rodarPainelCompleto();

        // Loop ativo de 1 em 1 segundo
        setInterval(rodarPainelCompleto, 1000);
    </script>
</body>
</html>
