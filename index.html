<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layout-geral {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .painel-fundo {
            width: 100%;
            height: 86vh;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Área central dos grandes contadores */
        .conteudo-displays {
            position: absolute;
            top: 17.2%;
            left: 23.6%;
            width: 52.8%;
            height: 61.6vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .quadro-display {
            width: 100%;
            height: 29.3vh;
            background-color: #061325;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 0 1.2vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 3.5px solid #0f243d;
        }

        .borda-verde {
            border: 3.5px solid #08221a;
        }

        .titulo-interno {
            color: #ffffff;
            font-size: 2.8vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contador-led {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 25vh; 
            font-weight: 700;
            letter-spacing: -4px;
            line-height: 0.75;
            text-align: center;
            width: 100%;
            transform: scaleY(1.15);
        }

        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 25px rgba(255, 17, 34, 0.7);
        }

        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 25px rgba(0, 255, 85, 0.7);
        }

        /* DATA E HORÁRIO DESCIDOS: Alinhados nas laterais do logotipo TRILHA */
        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.2vh;
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 3.5%; /* Descido para ficar na mesma linha da marca TRILHA */
            height: 5.5vh;
            display: flex;
            align-items: center;
            background-color: #f4f5f7; /* Cobre de forma sólida o fundo original */
            padding: 0 10px;
            border-radius: 4px;
            z-index: 20;
        }

        /* Aproxima a data do centro (lado esquerdo da logo TRILHA) */
        .posicao-data {
            left: 23%;
        }

        /* Aproxima o horário do centro (lado direito da logo TRILHA) */
        .posicao-hora {
            right: 23%;
        }

        /* Barra Inferior Externa */
        .barra-inferior-adicional {
            width: 100%;
            height: 14vh;
            background-color: #f4f5f7;
            border-top: 4px solid #0d2343;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4vw;
            z-index: 30;
        }

        /* Caixa de clima com a temperatura e texto descritivo lateral */
        .caixa-clima-externa {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.8vh;
            font-weight: 700;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .caixa-frase-externa {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3vh;
            font-weight: 700;
            color: #15803d;
            max-width: 60%;
            text-align: right;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="layout-geral">
        
        <!-- Painel Superior -->
        <div class="painel-fundo">
            
            <!-- Displays Principais -->
            <div class="conteudo-displays">
                <div class="quadro-display">
                    <div class="titulo-interno">Dias Sem Acidentes</div>
                    <div class="contador-led led-vermelho" id="num-dias">609</div>
                </div>
                
                <div class="quadro-display borda-verde">
                    <div class="titulo-interno">Nosso Recorde</div>
                    <div class="contador-led led-verde" id="num-recorde">609</div>
                </div>
            </div>

            <!-- DATA E HORÁRIO reposicionados próximos ao centro acima de TRILHA -->
            <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
            <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">14:22:52</div>

        </div>

        <!-- Barra Inferior com Clima Completo + Frase -->
        <footer class="barra-inferior-adicional">
            <div class="caixa-clima-externa" id="bloco-clima">☀️ 31°C - Ensolarado</div>
            <div class="caixa-frase-externa" id="bloco-frase">Segurança é valor, vida é prioridade absoluta.</div>
        </footer>

    </div>

    <script>
        const frasesSeguranca = [
            "Segurança é valor, vida é prioridade absoluta.",
            "Segurança não é um ato, é um hábito diário.",
            "Trabalhe com cuidado: sua família te espera!",
            "EPI completo é escudo para a sua vida.",
            "A melhor ferramenta de trabalho é a prevenção.",
            "A pressa passa, as consequências duram para sempre."
        ];

        let indexFrase = 0;

        function rotacionarFrases() {
            indexFrase = (indexFrase + 1) % frasesSeguranca.length;
            document.getElementById('bloco-frase').textContent = frasesSeguranca[indexFrase];
        }

        function atualizarPainel() {
            const agora = new Date();
            
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        function atualizarClimaSimulado() {
            const climas = [
                "☀️ 31°C - Ensolarado", 
                "🌤️ 30°C - Parcialmente Nublado", 
                "⛅ 29°C - Sol entre Nuvens"
            ];
            const aleatorio = climas[Math.floor(Math.random() * climas.length)];
            document.getElementById('bloco-clima').textContent = aleatorio;
        }

        setInterval(atualizarPainel, 1000);
        setInterval(rotacionarFrases, 8000);
        setInterval(atualizarClimaSimulado, 300000);
        
        atualizarPainel();
        atualizarClimaSimulado();
    </script>
</body>
</html>
