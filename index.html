<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .painel-fundo {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        
        /* Área dos displays configurada na horizontal (lado a lado) */
        .conteudo-displays {
            position: absolute;
            top: 27%;
            left: 5%;
            width: 90%;
            height: 40vh;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 5%;
            z-index: 10;
        }
        .quadro-display {
            width: 47.5%;
            height: 100%;
            background-color: #061325;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 3.5px solid #0f243d;
        }
        .borda-verde {
            border: 3.5px solid #08221a;
        }
        .titulo-interno {
            color: #ffffff;
            font-size: 3.8vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .contador-led {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 20vh;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 0.75;
            text-align: center;
            width: 100%;
            transform: scaleY(1.15);
        }
        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 25px rgba(255, 17, 34, 0.7);
        }
        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 25px rgba(0, 255, 85, 0.7);
        }
        
        /* Rodapé Container */
        .novo-rodape-container {
            position: absolute;
            bottom: 3vh;
            left: 3%;
            width: 94%;
            height: 18vh;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }
        
        .bloco-estatistica {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }
        
        .bloco-estatistica.alinhar-direita {
            align-items: flex-end;
        }
        
        .titulo-estatistica {
            font-family: 'Ubuntu', sans-serif;
            font-size: 2.4vh;
            font-weight: 700;
            color: #445566;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5vh;
        }
        
        /* Tamanho dos resultados no limite visual absoluto */
        .resultado-estatistica {
            font-family: 'Ubuntu', sans-serif;
            font-size: 7.2vh; 
            font-weight: 700;
            color: #000000; 
            white-space: nowrap;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 1.5vh;
        }
        
        .icone-clima-led {
            font-size: 8vh;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="painel-fundo">
        <!-- Displays Principais Lado a Lado -->
        <div class="conteudo-displays">
            <div class="quadro-display">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho">---</div>
            </div>
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde">---</div>
            </div>
        </div>
        
        <!-- Rodapé Ampliado -->
        <div class="novo-rodape-container">
            <div class="bloco-estatistica">
                <div class="titulo-estatistica">Semana Atual</div>
                <div class="resultado-estatistica">--ª Semana</div>
            </div>
            
            <div class="bloco-estatistica">
                <div class="titulo-estatistica">Data</div>
                <div class="resultado-estatistica">--/--/----</div>
            </div>
            
            <div class="bloco-estatistica">
                <div class="titulo-estatistica">Clima</div>
                <div class="resultado-estatistica">
                    <span class="icone-clima-led">☀️</span>
                    <span>--°C</span>
                </div>
            </div>
            
            <div class="bloco-estatistica alinhar-direita">
                <div class="titulo-estatistica">Horário</div>
                <div class="resultado-estatistica">--:--:--</div>
            </div>
        </div>
    </div>

    <!-- SCRIPT BLINDADO: Varredura Dinâmica por Caractere Alvo -->
    <script>
        // CONFIGURADO: Data inicial alterada de volta para 25 de novembro de 2024
        const DATA_INICIAL = new Date('2024-11-25T00:00:00');
        const DATA_BASE_34_SEMANA = new Date('2026-08-17T00:00:00');

        function rodarPainelSeguro() {
            try {
                const agora = new Date();

                // 1. Geração dos dados em tempo real
                const h = String(agora.getHours()).padStart(2, '0');
                const m = String(agora.getMinutes()).padStart(2, '0');
                const s = String(agora.getSeconds()).padStart(2, '0');
                const horaFormatada = `${h}:${m}:${s}`;

                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                const dataFormatada = `${dia}/${mes}/${ano}`;

                // Cálculo dos dias corridos desde 25/11/2024
                const hojeZerado = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const dataInicZerada = new Date(DATA_INICIAL.getFullYear(), DATA_INICIAL.getMonth(), DATA_INICIAL.getDate());
                const diferencaTempo = hojeZerado.getTime() - dataInicZerada.getTime();
                const diasCalculados = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));

                // Cálculo da semana (Avança toda segunda-feira)
                const baseSegundaZerada = new Date(DATA_BASE_34_SEMANA.getFullYear(), DATA_BASE_34_SEMANA.getMonth(), DATA_BASE_34_SEMANA.getDate());
                const diferencaSemanasTempo = hojeZerado.getTime() - baseSegundaZerada.getTime();
                const semanasPassadas = Math.floor(diferencaSemanasTempo / (1000 * 60 * 60 * 24 * 7));
                const semanaCalculada = 34 + semanasPassadas;

                // 2. Varredura cega por texto (Atualiza tudo mesmo sem IDs no HTML)
                const todosOsElementos = document.querySelectorAll('span, div, .contador-led, .resultado-estatistica');
                
                todosOsElementos.forEach(el => {
                    if (el.children.length === 0 || el.classList.contains('contador-led')) {
                        let texto = el.textContent.trim();

                        if (texto === '---') {
                            el.textContent = diasCalculados;
                        } else if (texto.includes('--:--') || (texto.includes(':') && texto.length <= 9)) {
                            el.textContent = horaFormatada;
                        } else if (texto.includes('--/--') || (texto.includes('/') && texto.length <= 11)) {
                            el.textContent = dataFormatada;
                        } else if (texto.includes('--ª') || texto.includes('Semana')) {
                            el.textContent = `${semanaCalculada}ª Semana`;
                        }
                    }
                });
            } catch (e) { console.error("Erro na varredura do painel:", e); }
        }

        // Consulta online estável do clima de São Luís
        function rodarClimaSeguro() {
            try {
                const url = `https://open-meteo.com`;
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.current) {
                            const tempReal = Math.round(data.current.temperature_2m);
                            const codigoClima = data.current.weather_code;

                            document.querySelectorAll('span').forEach(el => {
                                if (el.textContent.includes('°C') || el.textContent.includes('--°C')) {
                                    el.textContent = `${tempReal}°C`;
                                }
                            });

                            let emoji = "☀️";
