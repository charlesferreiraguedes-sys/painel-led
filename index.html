<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- Fontes oficiais e digital para os displays -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Ubuntu', sans-serif;
        }

        /* Container proporcional travado em 16:9 baseado no seu novo fundo limpo */
        .painel-fundo {
            width: 100vw;
            height: 100vh;
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16 / 9;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Container que centraliza as caixas no espaço cinza claro */
        .conteudo-displays {
            position: absolute;
            top: 17%;
            left: 23.6%;
            width: 52.8%;
            height: 61.8vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Estrutura idêntica dos blocos escuros industriais */
        .quadro-display {
            width: 100%;
            height: 29.5vh;
            background-color: #061325; /* Cor preta azulada fosca idêntica à original */
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 0;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7);
        }

        /* Bordas coloridas específicas para dar acabamento sobre o fundo cinza claro */
        .borda-vermelha {
            border: 4px solid #142844;
        }

        .borda-verde {
            border: 4px solid #0a291f;
        }

        /* Texto estático amarelo/branco do título interno */
        .titulo-interno {
            color: #ffffff;
            font-size: 2.8vh;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Números em LED Digital */
        .contador-led {
            font-family: 'Orbitron', sans-serif;
            font-size: 16.5vh; 
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 0.5vh;
        }

        .led-vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.7);
        }

        .led-verde {
            color: #00ff66;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }

        /* Posicionamento preciso das strings de texto no rodapé */
        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.5vh;
            font-weight: 700;
            color: #0d2343; /* Azul escuro corporativo dos textos do rodapé */
            position: absolute;
            bottom: 12.8%;
            line-height: 1;
        }

        /* Alinhado exatamente ao lado direito do ícone do calendário */
        .posicao-data {
            left: 17.2%;
        }

        /* Alinhado exatamente ao lado direito do ícone do relógio */
        .posicao-hora {
            right: 11.2%;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <!-- Blocos dos Contadores construídos sobre o espaço cinza claro -->
        <div class="conteudo-displays">
            
            <!-- Quadro Dias Sem Acidentes -->
            <div class="quadro-display borda-vermelha">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho" id="num-dias">609</div>
            </div>
            
            <!-- Quadro Nosso Recorde -->
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde" id="num-recorde">609</div>
            </div>

        </div>

        <!-- Textos Dinâmicos injetados direto nos espaços em branco nativos do rodapé -->
        <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
        <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">12:28:15</div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualização da Data automática (DD/MM/AAAA)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualização do Relógio automático (HH:MM:SS)
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Sincroniza as informações a cada segundo de forma contínua
        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
