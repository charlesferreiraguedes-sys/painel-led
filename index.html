<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança do Trabalho</title>
    <!-- Fontes do Google para aproximar do design da Foto 2 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Rajdhani:wght@700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Container Principal com a Imagem de Fundo Limpa */
        .painel-container {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 30px 40px;
            position: relative;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            width: 100%;
        }

        .logo-rede {
            width: 150px;
            visibility: hidden; /* Ocultado pois a logo já está impressa na imagem de fundo */
        }

        .titulo-central {
            text-align: center;
            margin-top: 10px;
        }

        .titulo-central h1 {
            font-size: 42px;
            font-weight: 800;
            color: #0b1a30;
            letter-spacing: 2px;
            font-family: 'Ubuntu', sans-serif;
        }

        .subtitulo {
            font-size: 13px;
            font-weight: 700;
            color: #1b8a4f;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: -2px;
        }

        .subtitulo::before, .subtitulo::after {
            content: "";
            display: inline-block;
            width: 40px;
            height: 2px;
            background-color: #1b8a4f;
        }

        .badge-gptw {
            width: 75px;
            visibility: hidden; /* Ocultado pois o selo já está impresso na imagem de fundo */
        }

        /* Área Central dos Contadores */
        .conteudo-principal {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            padding: 0 10px;
        }

        /* Blocos Escuros Arredondados com Bordas Suaves */
        .display-box {
            background-color: #071424;
            border-radius: 30px;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .display-label {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 2px;
        }

        /* Numeração Grande e Arredondada da Foto 2 */
        .numero-digital {
            font-family: 'Rajdhani', sans-serif;
            font-size: 110px;
            font-weight: 700;
            line-height: 0.9;
        }

        /* Cores exatas dos LEDs da Foto 2 */
        .led-vermelho {
            color: #ff3333;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }

        .led-verde {
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        /* Rodapé Ajustado */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .info-bloco {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
        }

        /* Customização dos Ícones do Rodapé */
        .icone-svg {
            width: 24px;
            height: 24px;
        }

        .info-texto h2 {
            font-size: 24px;
            font-weight: 700;
            color: #071424;
            line-height: 1;
        }

        .info-texto p {
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .frase-efeito {
            font-size: 14px;
            font-weight: 700;
            color: #071424;
            text-align: center;
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-trilha {
            width: 150px;
            visibility: hidden; /* Ocultado pois a logo inferior já está na imagem de fundo */
        }
    </style>
</head>
<body>

    <div class="painel-container">
        
        <!-- Elementos ocultados por CSS pois já fazem parte da sua imagem de fundo -->
        <div class="badge-gptw"></div>

        <!-- Cabeçalho -->
        <header class="header">
            <div class="logo-rede"></div>
            
            <div class="titulo-central">
                <h1>SEGURANÇA DO TRABALHO</h1>
                <div class="subtitulo">CUIDAR HOJE PARA PROTEGER SEMPRE</div>
            </div>
            
            <div></div>
        </header>

        <!-- Contadores -->
        <main class="conteudo-principal">
            
            <!-- Dias Sem Acidentes -->
            <div class="display-box">
                <div class="display-label">Dias Sem Acidentes</div>
                <div class="numero-digital led-vermelho" id="dias-sem-acidente">609</div>
            </div>

            <!-- Nosso Recorde -->
            <div class="display-box">
                <div class="display-label">Nosso Recorde</div>
                <div class="numero-digital led-verde" id="nosso-recorde">609</div>
            </div>

        </main>

        <!-- Rodapé -->
        <footer class="footer">
            
            <!-- Data -->
            <div class="info-bloco">
                <!-- Ícone Calendário Azul -->
                <svg class="icone-svg" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <rect x="3" y="4" width="18" height="18" rx="4" fill="#3b82f6"/>
                    <rect x="6" y="8" width="12" height="11" rx="1" fill="#ffffff"/>
                    <circle cx="9" cy="11" r="1" fill="#3b82f6"/><circle cx="13" cy="11" r="1" fill="#3b82f6"/>
                    <circle cx="9" cy="14" r="1" fill="#3b82f6"/><circle cx="13" cy="14" r="1" fill="#3b82f6"/>
                </svg>
                <div class="info-texto">
                    <h2 id="campo-data">27/07/2026</h2>
                    <p>Data</p>
                </div>
            </div>

            <!-- Frase Central -->
            <div class="frase-efeito">
                <!-- Ícone Escudo Azul -->
                <svg class="icone-svg" viewBox="0 0 24 24" fill="#1e3a8a" xmlns="http://w3.org">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 15l-4-4 1.41-1.41L11 13.17l5.59-5.59L18 9l-7 7z"/>
                </svg>
                <span>SEGURANÇA É VALOR, VIDA É PRIORIDADE</span>
            </div>

            <!-- Horário -->
            <div class="info-bloco">
                <!-- Ícone Relógio Azul -->
                <svg class="icone-svg" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <circle cx="12" cy="12" r="10" fill="#3b82f6"/>
                    <circle cx="12" cy="12" r="8" fill="#ffffff"/>
                    <path d="M12 7v5l3 2" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <div class="info-texto">
                    <h2 id="campo-hora">08:43:17</h2>
                    <p>Horário</p>
                </div>
            </div>

            <div class="logo-trilha"></div>

        </footer>

    </footer>

    <script>
        function atualizarRelogio() {
            const agora = new Date();
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('campo-data').textContent = `${dia}/${mes}/${ano}`;
            
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('campo-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();
    </script>
</body>
</html>
