<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 40px;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        /* Imagens de Fundo e Logotipos Estestruturados do Seu Painel */
        .bg-industrial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .logo-rede {
            position: absolute;
            top: 25px;
            left: 200px;
            height: 110px;
            z-index: 2;
        }

        .logo-towork {
            position: absolute;
            top: 25px;
            right: 240px;
            height: 110px;
            z-index: 2;
        }

        .logo-trilha {
            position: absolute;
            bottom: 15px;
            left: 55%;
            transform: translateX(-50%);
            height: 75px;
            z-index: 2;
        }

        /* Estrutura do Título Central */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 30px;
            margin-top: 50px;
            width: 100%;
            z-index: 3;
        }

        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 15px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            min-width: 650px;
        }

        .caixa-titulo-preta h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 8px;
        }

        .linha-verde {
            width: 60px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-size: 1.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Placares Grandes de Dias */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 320px;
            padding: 20px 10px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            color: #ffffff;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 6.5rem;
            font-weight: bold;
            line-height: 1;
            display: block;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé Ajustado */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 10px 10px;
            z-index: 3;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .grupo-esquerdo {
            display: flex;
            flex-direction: row;
            gap: 40px;
            align-items: center;
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icone-img {
            height: 55px;
            object-fit: contain;
        }

        .texto-info p {
            font-size: 0.9rem;
            color: #2c3e50;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 1px;
        }

        /* Tamanho Máximo Ampliado Solicitado */
        .texto-info h3 {
            font-size: 3.2rem;
            color: #0c2340;
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- Elementos Visuais Fixos Extraídos da Sua Imagem -->
    <img src="fundo.jpg" class="bg-industrial" alt="Fundo Industrial">
    <img src="logo_rede.png" class="logo-rede" alt="Logo ReDe">
    <img src="logo_towork.png" class="logo-towork" alt="Logo To Work">
    <img src="logo_trilha.png" class="logo-trilha" alt="Logo Trilha">

    <!-- Bloco de Conteúdo -->
    <div class="container-principal">
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <span class="numero-digital vermelho">---</span>
            </div>
            
            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <span class="numero-digital verde">---</span>
            </div>
        </main>
    </div>

    <!-- Rodapé Informativo -->
    <footer>
        <div class="grupo-esquerdo">
            <!-- Semana Atual -->
            <div class="bloco-info">
                <img src="icone_semana.png" class="icone-img" alt="Ícone Semana">
                <div class="texto-info">
                    <p>Semana Atual</p>
                    <h3>--ª Semana</h3>
                </div>
            </div>

            <!-- Data -->
            <div class="bloco-info">
                <img src="icone_data.png" class="icone-img" alt="Ícone Data">
                <div class="texto-info">
                    <p>Data</p>
                    <h3>--/--/----</h3>
                </div>
            </div>

            <!-- Clima São Luís -->
            <div class="bloco-info">
                <img src="icone_clima.png" class="icone-img" alt="Ícone Clima">
                <div class="texto-info">
                    <p>São Luís - MA</p>
                    <h3>--°C</h3>
                </div>
            </div>
        </div>

        <!-- Horário -->
        <div class="bloco-info">
            <img src="icone_relogio.png" class="icone-img" alt="Ícone Relógio">
            <div class="texto-info">
                <p>Horário</p>
                <h3>--:--:--</h3>
            </div>
        </div>
    </footer>
