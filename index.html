<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança do Trabalho</title>
    <!-- Fontes do Google correspondentes ao design final -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Container Proporcional 16:9 baseado na imagem de fundo */
        .painel-container {
            width: 100%;
            max-width: 1150px;
            aspect-ratio: 16 / 9;
            border-radius: 20px;
            position: relative;
            
            /* Ajuste definitivo do plano de fundo */
            background-image: url('fundo-painel.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ffffff;
            
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Título Centralizado - Movido mais para a direita para não bater no logo da ReDe */
        .header-titulo {
            position: absolute;
            top: 7%;
            left: 53%;
            transform: translateX(-50%);
            text-align: center;
            width: 60%;
            z-index: 10;
        }

        .header-titulo h1 {
            font-size: 38px;
            font-weight: 900;
            color: #0d2343;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .subtitulo {
            font-size: 13px;
            font-weight: 700;
            color: #1f8249;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 5px;
        }

        .subtitulo::before, .subtitulo::after {
            content: "";
            display: inline-block;
            width: 35px;
            height: 2px;
            background-color: #1f8249;
        }

        /* Bloco Central dos Contadores com recuo para a direita */
        .conteudo-principal {
            position: absolute;
            top: 27%;
            right: 4%;
            width: 46%; /* Ocupa a metade direita onde há espaço em branco */
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        /* Boxes Escuros idênticos aos da Foto 3 */
        .display-box {
            background-color: #061325;
            border-radius: 24px;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .display-label {
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 2px;
            font-family: 'Open Sans', sans-serif;
        }

        .numero-digital {
            font-size: 95px;
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: 2px;
        }

        /* Cores vivas dos números */
        .led-vermelho {
            color: #ff3344;
            text-shadow: 0 0 15px rgba(255, 51, 68, 0.5);
        }

        .led-verde {
            color: #00e676;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
        }

        /* Alinhamento do Rodapé por cima da linha cinza */
        .footer-dados {
            position: absolute;
            bottom: 4%;
            left: 4%;
            right: 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .info-bloco {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icone-svg {
            width: 20px;
            height: 20px;
        }

        .info-texto h2 {
            font-size: 20px;
            font-weight: 800;
            color: #061325;
            line-height: 1;
        }

        .info-texto p {
            font-size: 9px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1px;
        }

        .frase-efeito {
            font-size: 12px;
            font-weight: 800;
            color: #061325;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        /* Responsividade para manter proporção em telas mobile */
        @media (max-width: 768px) {
            .painel-container { aspect-ratio: auto; min-height: 100vh; background-size: cover; }
            .header-titulo { position: relative; top: 0; left: 0; transform: none; width: 100%; padding: 20px; }
            .header-titulo h1 { font-size: 24px; }
            .conteudo-principal { position: relative; top: 0; right: 0; width: 100%; padding: 20px; }
            .footer-dados { position: relative; bottom: 0; left: 0; right: 0; flex-direction: column; gap: 15px; padding: 20px; }
            .numero-digital { font-size: 70px; }
        }
    </style>
</head>
<body>

    <div class="painel-container">

        <!-- Cabeçalho Posicionado Baseado no Espaço da Foto 3 -->
        <div class="header-titulo">
            <h1>SEGURANÇA DO TRABALHO</h1>
            <div class="subtitulo">CUIDAR HOJE PARA PROTEGER SEMPRE</div>
        </div>

        <!-- Painéis de Contagem Deslocados para a Direita -->
        <main class="conteudo-principal">
            
            <!-- Dias Sem Acidentes -->
            <div class="display-box">
                <div class="display-label">Dias Sem Acidentes</div>
                <div class="numero-digital led-vermelho" id="dias-sem-acidente">609</div>
            </div>

            <!-- Nosso Recorde -->
            <div class="display-box">
                <div class="display-label">Nosso Recorde</div>
                <div class="numero-digital led-verde" id="nosso-recorde">609</div>
            </div>

        </main>

        <!-- Rodapé Alinhado com os Ícones -->
        <div class="footer-dados">
            
            <!-- Bloco de Data -->
            <div class="info-bloco">
                <svg class="icone-svg" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <rect x="3" y="4" width="18" height="18" rx="4" fill="#3b82f6"/>
                    <rect x="6" y="8" width="12" height="11" rx="1" fill="#ffffff"/>
                    <circle cx="9" cy="11" r="1" fill="#3b82f6"/><circle cx="13" cy="11" r="1" fill="#3b82f6"/>
                    <circle cx="9" cy="14" r="1" fill="#3b82f6"/><circle cx="13" cy="14" r="1" fill="#3b82f6"/>
                </svg>
                <div class="info-texto">
                    <h2 id="campo-data">27/07/2026</h2>
                    <p>Data</p>
                </div>
            </div>

            <!-- Frase Central -->
            <div class="frase-efeito">
                <svg class="icone-svg" viewBox="0 0 24 24" fill="#1e3a8a" xmlns="http://w3.org">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 15l-4-4 1.41-1.41L11 13.17l5.59-5.59L18 9l-7 7z"/>
                </svg>
                <span>SEGURANÇA É VALOR, VIDA É PRIORIDADE</span>
            </div>

            <!-- Bloco de Horário -->
            <div class="info-bloco">
                <svg class="icone-svg" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <circle cx="12" cy="12" r="10" fill="#3b82f6"/>
                    <circle cx="12" cy="12" r="8" fill="#ffffff"/>
                    <path d="M12 7v5l3 2" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <div class="info-texto">
                    <h2 id="campo-hora">10:29:12</h2>
                    <p>Horário</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Script de atualização de tempo real -->
    <script>
        function atualizarRelogio() {
            const agora = new Date();
            
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('campo-data').textContent = `${dia}/${mes}/${ano}`;
            
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('campo-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();
    </script>
</body>
</html>
