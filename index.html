<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- Importação das fontes: Orbitron para o LED Digital real e Ubuntu para os títulos -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .painel-fundo {
            width: 100vw;
            height: 100vh;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Bloco que agrupa os displays centrais */
        .conteudo-displays {
            position: absolute;
            top: 17.2%;
            left: 23.6%;
            width: 52.8%;
            height: 61.6vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* Estrutura dos blocos escuros industriais com cantos arredondados */
        .quadro-display {
            width: 100%;
            height: 29.3vh;
            background-color: #061325;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 0 1vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .borda-vermelha {
            border: 3.5px solid #0f243d;
        }

        .borda-verde {
            border: 3.5px solid #08221a;
        }

        .titulo-interno {
            color: #ffffff;
            font-size: 2.8vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Fonte LED Digital Orbitron para simular os 7 segmentos perfeitamente */
        .contador-led {
            font-family: 'Orbitron', sans-serif;
            font-size: 20vh; 
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 0.85;
            text-align: center;
            width: 100%;
        }

        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 25px rgba(255, 17, 34, 0.7);
        }

        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 25px rgba(0, 255, 85, 0.7);
        }

        /* Estilo comum para os dados flutuantes do rodapé */
        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.4vh;
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 12.8%;
            line-height: 1;
            background-color: #f4f5f7; /* Cor cinza claro exata do fundo da foto */
            padding: 2px 5px;
            z-index: 10;
        }

        /* Alinhamento ajustado milimetricamente para o lado esquerdo */
        .posicao-data {
            left: 17.5%;
        }

        /* Alinhamento ajustado milimetricamente para o lado direito */
        .posicao-hora {
            right: 13.5%;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <!-- Renderização dos quadros sobre o fundo cinza claro -->
        <div class="conteudo-displays">
            
            <!-- Quadro Dias Sem Acidentes -->
            <div class="quadro-display borda-vermelha">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho" id="num-dias">609</div>
            </div>
            
            <!-- Quadro Nosso Recorde -->
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde" id="num-recorde">609</div>
            </div>

        </div>

        <!-- Renderização dos textos dinâmicos do rodapé -->
        <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
        <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">08:43:17</div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualização automática da Data (DD/MM/AAAA)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualização automática do Horário (HH:MM:SS)
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Executa em tempo real a cada segundo de forma contínua
        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
