<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 20px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 480px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé Transparente */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 25px 50px;
            border: none;
            box-shadow: none;
        }

        .grupo-esquerdo {
            display: flex;
            flex-direction: row;
            gap: 60px;
            align-items: center;
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 25px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8), -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        .icone {
            font-size: 4rem;
        }

        .texto-info p {
            font-family: 'Arial', sans-serif;
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .texto-info h3 {
            font-family: 'Arial', sans-serif;
            font-size: 2.8rem;
            color: #0c2340;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar com Contagem Automática -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>
            
            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>
    </div>

    <!-- Rodapé -->
    <footer>
        <div class="grupo-esquerdo">
            <!-- Nova Caixa de Semanas colocada no espaço marcado -->
            <div class="bloco-info">
                <div class="icone">🗓️</div>
                <div class="texto-info">
                    <p>Semana Atual</p>
                    <h3 id="semana-campo">--ª Semana</h3>
                </div>
            </div>

            <!-- Data -->
            <div class="bloco-info">
                <div class="icone">📅</div>
                <div class="texto-info">
                    <p>Data</p>
                    <h3 id="data-campo">--/--/----</h3>
                </div>
            </div>

            <!-- Clima Local Autônomo -->
            <div class="bloco-info">
                <div id="clima-icone" class="icone">☀️</div>
                <div class="texto-info">
                    <p>São Luís - MA</p>
                    <h3 id="temp-campo">28°C</h3>
                </div>
            </div>
        </div>

        <!-- Horário -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <p>Horário</p>
                <h3 id="relogio-campo">--:--:--</h3>
            </div>
        </div>
    </footer>

    <!-- Scripts de Atualização Autônomos -->
    <script>
        function calcularDias() {
            const dataInicial = new Date(2024, 10, 25); // 25/11/2024 (Mês no JS começa em 0)
            const dataAtual = new Date();

            dataInicial.setHours(0, 0, 0, 0);
            dataAtual.setHours(0, 0, 0, 0);

            const diferencaTempo = dataAtual.getTime() - dataInicial.getTime();
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));

            if (diferencaDias >= 0) {
                document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                document.getElementById('nosso-recorde').textContent = diferencaDias;
            }
        }

        function calcularSemanas() {
            const dataAtual = new Date();
            
            // Base fixada em 17/08/2026 (uma segunda-feira na qual o painel exibe a 34ª semana)
            const dataBaseSegunda = new Date(2026, 7, 17); 
            dataBaseSegunda.setHours(0, 0, 0, 0);
            
            // Cria cópia da data atual zerando as horas para comparar apenas os dias
            const hoje = new Date(dataAtual.getTime());
            hoje.setHours(0, 0, 0, 0);
            
            // Calcula os dias corridos desde a data base
            const diferencaTempo = hoje.getTime() - dataBaseSegunda.getTime();
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            
            // Divide os dias por 7 para descobrir quantas semanas inteiras se passaram
            const semanasPassadas = Math.floor(diferencaDias / 7);
            
            // Soma as semanas passadas à nossa semana base (34)
            const semanaAtual = 34 + semanasPassadas;
            
            document.getElementById('semana-campo').textContent = `${semanaAtual}ª Semana`;
        }

        function atualizarPainel() {
            const agora = new Date();

            // Relógio ativo segundo a segundo
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;

            // Data atualizada dinamicamente
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;

            // Atualização inteligente do clima baseado no horário de São Luís - MA
             atualizarClimaSimulado(agora.getHours());
        }

        function atualizarClimaSimulado(horaAtual) {
            let temperatura = 27; // Padrão
            let icone = "☀️"; // Ensolarado padrão
