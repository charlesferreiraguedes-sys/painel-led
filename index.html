<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- Importação de fontes: Share Tech Mono para o visual de LED Digital de 7 segmentos -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Share+Tech+Mono&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Garante preenchimento total e remove margens pretas externas */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ajuste de escala para preenchimento total da tela sem bordas pretas */
        .painel-fundo {
            width: 100vw;
            height: 100vh;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Alargado de 52.8% para 53.3% e ajustada a posição inicial para cobrir toda a área interna */
        .conteudo-displays {
            position: absolute;
            top: 17%;
            left: 23.35%;
            width: 53.3%;
            height: 61.8vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Estrutura dos blocos escuros industriais com as curvas exatas */
        .quadro-display {
            width: 100%;
            height: 29.5vh;
            background-color: #061325;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2.2vh 0 1vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* Cores das bordas que fundem com o limite da imagem */
        .borda-vermelha {
            border: 3.5px solid #0f243d;
        }

        .borda-verde {
            border: 3.5px solid #08221a;
        }

        .titulo-interno {
            color: #ffffff;
            font-size: 2.6vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Mudança de fonte e ajuste de estilo para o visual de LED/Cronômetro Digital */
        .contador-led {
            font-family: 'Share Tech Mono', monospace;
            font-size: 21vh; /* Aumentado para melhor leitura digital */
            font-weight: 700;
            letter-spacing: -4px;
            line-height: 0.9;
        }

        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 20px rgba(255, 17, 34, 0.6);
        }

        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 20px rgba(0, 255, 85, 0.6);
        }

        /* Posicionamento calibrado pixel por pixel no rodapé */
        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.2vh;
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 12.8%;
            line-height: 1;
        }

        /* Centralizado perfeitamente no espaço em branco acima da palavra "DATA" */
        .posicao-data {
            left: 19.3%;
        }

        /* Centralizado perfeitamente no espaço em branco acima da palavra "HORÁRIO" */
        .posicao-hora {
            right: 13.9%;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <div class="conteudo-displays">
            
            <!-- Quadro Dias Sem Acidentes -->
            <div class="quadro-display borda-vermelha">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho" id="num-dias">609</div>
            </div>
            
            <!-- Quadro Nosso Recorde -->
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde" id="num-recorde">609</div>
            </div>

        </div>

        <!-- Alinhamento exato das informações do rodapé -->
        <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
        <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">12:35:32</div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualiza a Data (DD/MM/AAAA)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualiza o Horário (HH:MM:SS)
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Mantém a sincronização contínua a cada segundo
        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
