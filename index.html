<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- Fonte digital para os números do painel -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Ubuntu', sans-serif;
        }

        /* Container proporcional travado em 16:9 chamando o seu arquivo correto */
        .painel-fundo {
            width: 100vw;
            height: 100vh;
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16 / 9;
            
            /* Puxa exatamente o arquivo fundo-painel.jpg do seu repositório */
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Estilo e tamanho dos grandes números em LED */
        .contador-digital {
            font-family: 'Orbitron', sans-serif;
            font-size: 19.5vh;
            font-weight: 700;
            position: absolute;
            left: 51.5%;
            transform: translateX(-50%);
            letter-spacing: -2px;
            line-height: 1;
        }

        /* Alinhamento vertical do contador vermelho */
        .dias-sem-acidente {
            top: 24%;
            color: #ff1a1a;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.7);
        }

        /* Alinhamento vertical do contador verde */
        .nosso-recorde {
            top: 55.5%;
            color: #00ff66;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }

        /* Estilo dos textos dinâmicos do rodapé */
        .texto-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.5vh;
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 12.8%;
            line-height: 1;
        }

        /* Posicionamento exato ao lado do ícone de calendário */
        .campo-data {
            left: 17%;
        }

        /* Posicionamento exato ao lado do ícone de relógio */
        .campo-hora {
            right: 14%;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <!-- Valores numéricos em tempo real -->
        <div class="contador-digital dias-sem-acidente" id="num-dias">609</div>
        <div class="contador-digital nosso-recorde" id="num-recorde">609</div>

        <!-- Dados dinâmicos do rodapé -->
        <div class="texto-rodape campo-data" id="txt-data">27/07/2026</div>
        <div class="texto-rodape campo-hora" id="txt-hora">11:58:29</div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualização da Data no padrão brasileiro (DD/MM/AAAA)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualização do Relógio (HH:MM:SS)
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Mantém os dados atualizados a cada segundo
        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
