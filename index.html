<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <!-- CORRIGIDO: Links das fontes do Google corrigidos para evitar bloqueios de segurança -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2vw;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 3vh;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 1.5vh 3vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 45vw;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Ubuntu', sans-serif;
            font-size: 4vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
            margin-top: 0.5vh;
        }

        .linha-verde {
            width: 4vw;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Ubuntu', sans-serif;
            font-size: 1.8vh;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 1vw;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 5px solid #142847;
            border-radius: 25px;
            width: 35vw;
            height: 32vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5vh 1vw 1.5vh 1vw;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
        }

        .painel-contador h2 {
            font-family: 'Ubuntu', sans-serif;
            color: #ffffff;
            font-size: 2.8vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* TAMANHO MÁXIMO DOS CONTADORES: Uso de fonte digital Chakra Petch esticada na vertical */
        .numero-digital {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 22vh;
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -2px;
            text-align: center;
            width: 100%;
            transform: scaleY(1.1);
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.7);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }

        /* Rodapé Estruturado e Protegido */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 1vh 1vw;
            margin-bottom: 1vh;
            z-index: 100;
        }

        .grupo-esquerdo {
            display: flex;
            flex-direction: row;
            gap: 4vw;
            align-items: center;
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8), -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        .icone {
            font-size: 6.5vh;
            display: flex;
            align-items: center;
        }

        .texto-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .texto-info p {
            font-family: 'Ubuntu', sans-serif;
            font-size: 1.8vh;
            color: #2c3e50;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
            line-height: 1;
        }

        /* TAMANHO GIGANTE DO RODAPÉ: Redimensionado para o limite máximo físico */
        .texto-info h3, .texto-info div.resultado-semana {
            font-family: 'Ubuntu', sans-serif;
            font-size: 5.8vh;
            color: #0c2340;
            font-weight: 700;
            white-space: nowrap;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar com Contagem Automática -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>

    </div>

    <!-- Rodapé Informativo -->
    <footer>
        <div class="grupo-esquerdo">
            <!-- Campo Semana Atual -->
            <div class="bloco-info">
                <div class="icone">🗓️</div>
                <div class="texto-info">
                    <p>Semana Atual</p>
                    <div id="semana-campo" class="resultado-semana">--ª Semana</div>
                </div>
            </div>

            <!-- Data -->
            <div class="bloco-info">
                <div class="icone">📅</div>
                <div class="texto-info">
                    <p>Data</p>
                    <h3 id="data-campo">--/--/----</h3>
                </div>
            </div>

            <!-- Clima Local Autônomo -->
            <div class="bloco-info">
                <div id="clima-icone" class="icone">☀️</div>
                <div class="texto-info">
                    <p>São Luís - MA</p>
                    <h3 id="temp-campo">--°C</h3>
                </div>
            </div>
        </div>

        <!-- Horário -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <p>Horário</p>
                <h3 id="relogio-campo">--:--:--</h3>
            </div>
        </div>
    </footer>

    <!-- Scripts de Atualização Autônomos Completos -->
    <script>
        function calcularDias() {
            try {
                const dataInicial = new Date(2024, 10, 25); // 25/11/2024 (Mês no JS começa em 0)
                const dataAtual = new Date();
                
                dataInicial.setHours(0, 0, 0, 0);
                dataAtual.setHours(0, 0, 0, 0);
                
                const diferencaTempo = dataAtual.getTime() - dataInicial.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
                
                if (diferencaDias >= 0) {
                    document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                    document.getElementById('nosso-recorde').textContent = diferencaDias;
                }
            } catch (e) { console.error("Erro ao calcular dias:", e); }
        }

        function calcularSemanas() {
            try {
                const dataAtual = new Date();
                const dataBaseSegunda = new Date(2026, 7, 17); // Segunda-feira de referência para a 34ª semana
                dataBaseSegunda.setHours(0, 0, 0, 0);
                
                const hoje = new Date(dataAtual.getTime());
                hoje.setHours(0, 0, 0, 0);
                
                const diferencaTempo = hoje.getTime() - dataBaseSegunda.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
                
                const semanasPassadas = Math.floor(diferencaDias / 7);
                const semanaAtual = 34 + semanasPassadas;
                
                document.getElementById('semana-campo').textContent = `${semanaAtual}ª Semana`;
            } catch (e) { console.error("Erro ao calcular semanas:", e); }
        }

        function atualizarPainel() {
            try {
                const agora = new Date();
