<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 20px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #002d62; 
            text-transform: uppercase;
            line-height: 1.1;
            text-shadow: 0px 0px 1px rgba(255,255,255,0.2);
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .linha-verde {
            width: 80px;
            height: 2px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #006437;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 480px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé com Fundo Transparente reorganizado */
        footer {
            display: flex;
            justify-content: space-between; /* Mantém blocos nas extremidades opostas */
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 25px 50px;
            border: none;
            box-shadow: none;
        }

        /* Agrupamento do lado esquerdo (Data + Clima) */
        .grupo-esquerdo {
            display: flex;
            flex-direction: row;
            gap: 60px; /* Distância próxima, mas nitidamente separada */
            align-items: center;
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 25px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8), -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        .icone {
            font-size: 4rem;
        }

        .texto-info p {
            font-family: 'Arial', sans-serif;
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .texto-info h3 {
            font-family: 'Arial', sans-serif;
            font-size: 2.8rem;
            color: #0c2340;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar Lateralizado -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div class="numero-digital vermelho">611</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div class="numero-digital verde">611</div>
            </div>
        </main>

    </div>

    <!-- Rodapé Customizado -->
    <footer>
        <!-- Lado Esquerdo: Data e Clima Lado a Lado -->
        <div class="grupo-esquerdo">
            <!-- Data -->
            <div class="bloco-info">
                <div class="icone">📅</div>
                <div class="texto-info">
                    <p>Data</p>
                    <h3 id="data-campo">29/07/2026</h3>
                </div>
            </div>

            <!-- Clima Online -->
            <div class="bloco-info">
                <div class="icone">☀️</div>
                <div class="texto-info">
                    <p>São Luís - MA</p>
                    <h3 id="temp-campo">28°C</h3>
                </div>
            </div>
        </div>

        <!-- Lado Direito: Horário -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <p>Horário</p>
                <h3 id="relogio-campo">09:13:00</h3>
            </div>
        </div>
    </footer>

    <!-- Scripts de Atualização -->
    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;
            
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;
        }

        async function buscarTemperaturaOnline() {
            try {
                const response = await fetch('https://open-meteo.com');
                const data = await response.json();
                if (data && data.current_weather) {
                    const tempArredondada = Math.round(data.current_weather.temperature);
                    document.getElementById('temp-campo').textContent = `${tempArredondada}°C`;
                }
            } catch (error) {
                console.log("Erro ao carregar dados de temperatura.");
            }
        }

        setInterval(atualizarPainel, 1000);
        atualizarPainel();
        buscarTemperaturaOnline();
        setInterval(buscarTemperaturaOnline, 900000);
    </script>

</body>
</html>
