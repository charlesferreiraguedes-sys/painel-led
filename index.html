<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .painel-fundo {
            width: 100vw;
            height: 100vh;
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16 / 9;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Área central dos grandes contadores */
        .conteudo-displays {
            position: absolute;
            top: 17.2%;
            left: 23.6%;
            width: 52.8%;
            height: 61.6vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .quadro-display {
            width: 100%;
            height: 29.3vh;
            background-color: #061325;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 0 1.2vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 3.5px solid #0f243d;
        }

        .borda-verde {
            border: 3.5px solid #08221a;
        }

        .titulo-interno {
            color: #ffffff;
            font-size: 2.8vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contador-led {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 25vh; 
            font-weight: 700;
            letter-spacing: -4px;
            line-height: 0.75;
            text-align: center;
            width: 100%;
            transform: scaleY(1.15);
        }

        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 25px rgba(255, 17, 34, 0.7);
        }

        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 25px rgba(0, 255, 85, 0.7);
        }

        /* Base para os textos flutuantes do rodapé (DATA e HORÁRIO) */
        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.4vh;
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 13.8%; 
            height: 5vh;
            display: flex;
            align-items: center;
            z-index: 20;
        }

        .posicao-data {
            left: 16.5%;
        }

        .posicao-hora {
            left: 77.0%; 
        }

        /* AMPLIAÇÃO MÁXIMA DOS QUADROS ADICIONAIS: Ocupando todo o espaço entre a base cinza e as caixas de cima */
        .caixa-adicional {
            position: absolute;
            bottom: 3.5%;
            height: 13.5vh; /* Altura máxima expandida para preencher o vão vertical por completo */
            background-color: rgba(13, 35, 67, 0.12);
            border-left: 8px solid #0d2343; /* Linha de destaque lateral mais robusta */
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-family: 'Ubuntu', sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            z-index: 25;
        }

        /* Caixa de Clima expandida abaixo de DATA */
        .caixa-clima {
            left: 11.5%;
            width: 22%;
            font-size: 3.4vh; /* Fonte ampliada para grande visibilidade */
            font-weight: 700;
            color: #1e3a8a;
            justify-content: center;
            text-align: center;
        }

        /* Caixa de Frase Motivacional expandida abaixo de HORÁRIO */
        .caixa-frase {
            left: 71.0%;
            width: 25%;
            font-size: 2.2vh; /* Fonte ampliada para grande visibilidade */
            font-weight: 700;
            color: #15803d;
            line-height: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <!-- Displays Principais -->
        <div class="conteudo-displays">
            <div class="quadro-display">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho" id="num-dias">609</div>
            </div>
            
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde" id="num-recorde">609</div>
            </div>
        </div>

        <!-- Campos de Texto Principais do Rodapé -->
        <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
        <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">13:43:56</div>

        <!-- Caixas Extras Ampliadas Ocupando Todo o Vão Livre Vertical -->
        <div class="caixa-adicional caixa-clima" id="bloco-clima">☀️ 31°C</div>
        <div class="caixa-adicional caixa-frase" id="bloco-frase">Segurança não é um ato, é um hábito diário.</div>

    </div>

    <script {nonce}>
        // Banco de dados de frases motivacionais de Segurança do Trabalho
        const frasesSeguranca = [
            "Segurança não é um ato, é um hábito diário.",
            "Trabalhe com cuidado: sua família te espera!",
            "EPI completo é escudo para a sua vida.",
            "A melhor ferramenta de trabalho é a prevenção.",
            "Segurança é valor, vida é prioridade absoluta.",
            "A pressa passa, as consequências duram."
        ];

        let indexFrase = 0;

        function rotacionarFrases() {
            indexFrase = (indexFrase + 1) % frasesSeguranca.length;
            document.getElementById('bloco-frase').textContent = frasesSeguranca[indexFrase];
        }

        function atualizarPainel() {
            const agora = new Date();
            
            // Atualiza data
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualiza hora
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Função de simulação do clima dinâmico local
        function atualizarClimaSimulado() {
            const climas = ["☀️ 31°C", "🌤️ 30°C", "⛅ 29°C"];
            const aleatorio = climas[Math.floor(Math.random() * climas.length)];
            document.getElementById('bloco-clima').textContent = aleatorio;
        }

        // Inicializações e intervalos de execução
        setInterval(atualizarPainel, 1000);
        setInterval(rotacionarFrases, 7000); // Rotaciona a frase a cada 7 segundos
        setInterval(atualizarClimaSimulado, 300000); // Atualiza dados climáticos a cada 5 minutos
        
        atualizarPainel();
        atualizarClimaSimulado();
    </script>
</body>
</html>
