<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho da sua imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            color: #0c2340;
            overflow: hidden;
        }

        /* Topo do Painel */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .titulo-central {
            text-align: center;
        }

        .titulo-central h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #0c2340;
            text-transform: uppercase;
        }

        .subtitulo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4b6b94;
            letter-spacing: 3px;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitulo::before, .subtitulo::after {
            content: "";
            display: inline-block;
            width: 60px;
            height: 2px;
            background-color: #4b6b94;
        }

        .selo-gptw {
            position: absolute;
            right: 0;
            top: 0;
            width: 100px;
        }

        /* Conteúdo Central - Placar */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 25px;
            margin: 20px 0;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 650px;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            color: #ffffff;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé de Informações */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px 40px;
            border: 2px solid #e0e6ed;
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icone {
            font-size: 2rem;
        }

        .texto-info p {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-weight: bold;
            text-transform: uppercase;
        }

        .texto-info h3 {
            font-size: 1.5rem;
            color: #0c2340;
            font-weight: bold;
        }

        .mensagem-centro {
            text-align: center;
            max-width: 40%;
        }

        .mensagem-centro h3 {
            font-size: 1.2rem;
            color: #0c2340;
            font-weight: 900;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Topo -->
    <header>
        <div class="titulo-central">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo">CUIDAR HOJE PARA PROTEGER SEMPRE</div>
        </div>
    </header>

    <!-- Placar Central -->
    <main>
        <!-- Dias Sem Acidentes -->
        <div class="painel-contador">
            <h2>Dias Sem Acidentes</h2>
            <div class="numero-digital vermelho">611</div>
        </div>

        <!-- Nosso Recorde -->
        <div class="painel-contador">
            <h2>Nosso Recorde</h2>
            <div class="numero-digital verde">611</div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <!-- Data -->
        <div class="bloco-info">
            <div class="icone">📅</div>
            <div class="texto-info">
                <h3>29/07/2026</h3>
                <p>Data</p>
            </div>
        </div>

        <!-- Slogan Centralizado -->
        <div class="mensagem-centro">
            <h3>SEGURANÇA É VALOR,<br>VIDA É PRIORIDADE</h3>
        </div>

        <!-- Horário -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <h3>08:42:30</h3>
                <p>Horário</p>
            </div>
        </div>
    </footer>

</body>
</html>
