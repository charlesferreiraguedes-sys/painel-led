<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- Fonte digital para os números -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
        }

        /* Container que usa o link direto da imagem para garantir o carregamento */
        .painel-fundo {
            width: 100vw;
            height: 100vh;
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16 / 9;
            
            /* Usando o link público da imagem que você enviou */
            background-image: url('https://squarespace-cdn.com');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Estilo comum para os grandes números do contador */
        .contador-digital {
            font-family: 'Orbitron', sans-serif;
            font-size: 13.5vh;
            font-weight: 700;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: 2px;
            line-height: 1;
        }

        /* Posição exata do número vermelho */
        .dias-sem-acidente {
            top: 24.5%;
            color: #ff2222;
            text-shadow: 0 0 20px rgba(255, 34, 34, 0.6);
        }

        /* Posição exata do número verde */
        .nosso-recorde {
            top: 56%;
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Estilo comum para os dados do rodapé */
        .texto-rodape {
            font-family: 'Roboto', sans-serif;
            font-size: 3.2vh;
            font-weight: 700;
            color: #0f2d59;
            position: absolute;
            bottom: 12.8%;
            line-height: 1;
        }

        /* Alinhamento da Data dinâmica */
        .campo-data {
            left: 17.5%;
        }

        /* Alinhamento do Horário dinâmico */
        .campo-hora {
            right: 13.8%;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <!-- Números dinâmicos sobrepostos nos espaços pretos -->
        <div class="contador-digital dias-sem-acidente" id="num-dias">609</div>
        <div class="contador-digital nosso-recorde" id="num-recorde">609</div>

        <!-- Informações dinâmicas sobrepostas nos espaços brancos do rodapé -->
        <div class="texto-rodape campo-data" id="txt-data">27/07/2026</div>
        <div class="texto-rodape campo-hora" id="txt-hora">08:43:17</div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualiza a Data automaticamente
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualiza o Horário automaticamente
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Executa a atualização a cada segundo
        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
