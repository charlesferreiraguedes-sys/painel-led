<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2vw;
            overflow: hidden;
            position: relative;
        }

        /* ANIMAÇÃO 1: Efeito Scanline (Linha de monitor de vídeo industrial) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 3vh;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 1.5vh 4vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
            animation: surgirPainel 1s ease-out; /* Entrada suave */
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 4.5vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 0.5vh;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 2vh;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 44vw;
            height: 32vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5vh 15px 1.5vh 15px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
            animation: surgirPainel 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animação de entrada elástica */
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 3vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Arial', sans-serif;
            font-size: 12rem;
            font-weight: bold;
            line-height: 1;
        }

        /* ANIMAÇÃO 2: Pulsação de brilho (Glow) nos LEDs centrais */
        .vermelho {
            color: #ff1a1a;
            animation: pulsarGlowVermelho 2.5s infinite alternate ease-in-out;
        }

        .verde {
            color: #00ff66;
            animation: pulsarGlowVerde 2.5s infinite alternate ease-in-out;
        }

        /* Rodapé de Caixas Pretas */
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 1vh 0;
            gap: 1.5vw;
        }

        .caixa-info-preta-rodape {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            flex: 1;
            height: 16vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5vh 10px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
            animation: surgirPainel 1.5s ease-out;
        }

        .caixa-info-preta-rodape p {
            font-family: 'Arial', sans-serif;
            font-size: 1.8vh;
            color: #a2b4c7;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5vh;
            letter-spacing: 1px;
        }

        .resultado-gigante-rodape {
            font-family: 'Arial', sans-serif;
            font-size: 6.2vh;
            color: #ffffff; 
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
            animation: pulsarGlowAzul 3s infinite alternate ease-in-out;
        }

        /* CONFIGURAÇÃO DOS EFEITOS DE ANIMAÇÃO (Keyframes CSS) */
        @keyframes surgirPainel {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulsarGlowVermelho {
            from { text-shadow: 0 0 10px rgba(255, 26, 26, 0.4), 0 0 20px rgba(255, 26, 26, 0.2); }
            to { text-shadow: 0 0 25px rgba(255, 26, 26, 0.8), 0 0 35px rgba(255, 26, 26, 0.5); }
        }

        @keyframes pulsarGlowVerde {
            from { text-shadow: 0 0 10px rgba(0, 255, 102, 0.4), 0 0 20px rgba(0, 255, 102, 0.2); }
            to { text-shadow: 0 0 25px rgba(0, 255, 102, 0.8), 0 0 35px rgba(0, 255, 102, 0.5); }
        }

        @keyframes pulsarGlowAzul {
            from { text-shadow: 0 0 8px rgba(0, 170, 255, 0.3); }
            to { text-shadow: 0 0 18px rgba(0, 170, 255, 0.6), 0 0 25px rgba(0, 170, 255, 0.4); }
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar Eletrônico Animado -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>
    </div>

    <!-- Rodapé de Caixas Pretas -->
    <footer>
        <div class="caixa-info-preta-rodape">
            <p>Semana Atual</p>
            <div id="semana-campo" class="resultado-gigante-rodape">--ª Semana</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Data</p>
            <div id="data-campo" class="resultado-gigante-rodape">--/--/----</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>São Luís - MA</p>
            <div id="temp-campo" class="resultado-gigante-rodape">--°C</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Horário</p>
            <div id="relogio-campo" class="resultado-gigante-rodape">--:--:--</div>
        </div>
    </footer>

    <script>
        function rodarPainelCompleto() {
            try {
                const agora = new Date();
                
                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0');
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;
                
                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;
                
                const dataInicial = new Date(2024, 10, 25);
                dataInicial.setHours(0, 0, 0, 0);
                const hojeZerado = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const diferencaDias = Math.floor((hojeZerado.getTime() - dataInicial.getTime()) / (1000 * 60 * 60 * 24));
                
                if (diferencaDias >= 0) {
                    document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                    document.getElementById('nosso-recorde').textContent = diferencaDias;
                }

                const dataBaseSegunda = new Date(2026, 7, 17);
