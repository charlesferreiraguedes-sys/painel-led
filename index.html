<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2vw;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 2vh;
            margin-top: 1vh;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 2vh 4vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 50vw;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 4.8vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
            margin-top: 1vh;
        }

        .linha-verde {
            width: 5vw;
            height: 4px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 2.2vh;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 1vw;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 5px solid #142847;
            border-radius: 25px;
            width: 32vw;
            padding: 3vh 1.5vw;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
        }

        /* AMPLIADO: Títulos dos contadores principais */
        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 2.8vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5vh;
            font-weight: bold;
        }

        /* AMPLIADO AO MÁXIMO: Números digitais gigantes */
        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 17vh;
            font-weight: bold;
            line-height: 0.9;
            letter-spacing: -2px;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.7);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }

        /* Rodapé Ajustado */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 2vh 2vw;
            border: none;
            box-shadow: none;
        }

        .grupo-esquerdo {
            display: flex;
            flex-direction: row;
            gap: 4vw;
            align-items: center;
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 1vw;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8), -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        /* AMPLIADO: Ícones do rodapé */
        .icone {
            font-size: 5.5vh;
        }

        .texto-info p {
            font-family: 'Arial', sans-serif;
            font-size: 1.8vh;
            color: #2c3e50;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        /* AMPLIADO AO MÁXIMO: Resultados informativos gigantes */
        .texto-info h3 {
            font-family: 'Arial', sans-serif;
            font-size: 4.8vh;
            color: #0c2340;
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar com Contagem Automática -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>

    </div>

    <!-- Rodapé -->
    <footer>
        <div class="grupo-esquerdo">
            <!-- ADICIONADO: Campo Semana Atual -->
            <div class="bloco-info">
                <div class="icone">🗓️</div>
                <div class="texto-info">
                    <p>Semana Atual</p>
                    <div id="semana-campo" style="font-family: 'Arial', sans-serif; font-size: 4.8vh; color: #0c2340; font-weight: 900; white-space: nowrap; line-height: 1;">34ª Semana</div>
                </div>
            </div>

            <!-- Data -->
            <div class="bloco-info">
                <div class="icone">📅</div>
                <div class="texto-info">
                    <p>Data</p>
                    <h3 id="data-campo">--/--/----</h3>
                </div>
            </div>

            <!-- Clima Local Autônomo -->
            <div class="bloco-info">
                <div id="clima-icone" class="icone">☀️</div>
                <div class="texto-info">
                    <p>São Luís - MA</p>
                    <h3 id="temp-campo">28°C</h3>
                </div>
            </div>
        </div>

        <!-- Horário -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <p>Horário</p>
                <h3 id="relogio-campo">--:--:--</h3>
            </div>
        </div>
    </footer>

    <!-- Scripts de Atualização Autônomos -->
    <script>
        function calcularDias() {
            const dataInicial = new Date(2024, 10, 25); // 25/11/2024 (Mês no JS começa em 0)
            const dataAtual = new Date();
            
            dataInicial.setHours(0, 0, 0, 0);
            dataAtual.setHours(0, 0, 0, 0);
            
            const diferencaTempo = dataAtual.getTime() - dataInicial.getTime();
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            
            if (diferencaDias >= 0) {
                document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                document.getElementById('nosso-recorde').textContent = diferencaDias;
            }
        }

        // LÓGICA AUTOMÁTICA DA SEMANA: Baseada na 34ª semana travada na segunda-feira correspondente (17/08/2026)
        function calcularSemanas() {
            const dataAtual = new Date();
            const dataBaseSegunda = new Date(2026, 7, 17); // 17/08/2026
            dataBaseSegunda.setHours(0, 0, 0, 0);
            
            const hoje = new Date(dataAtual.getTime());
            hoje.setHours(0, 0, 0, 0);
            
            const diferencaTempo = hoje.getTime() - dataBaseSegunda.getTime();
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            
            // Divide por 7 para somar uma semana completa a cada segunda-feira que passa
            const semanasPassadas = Math.floor(diferencaDias / 7);
            const semanaAtual = 34 + semanasPassadas;
            
            document.getElementById('semana-campo').textContent = `${semanaAtual}ª Semana`;
        }

        function atualizarPainel() {
            const agora = new Date();
            
            // Relógio ativo segundo a segundo
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;
            
            // Data atualizada dinamicamente
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
