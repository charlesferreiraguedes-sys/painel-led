<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança do Trabalho</title>
    <!-- Fontes do Google para os textos e os números digitais -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Principal do Painel */
        .painel-container {
            width: 100%;
            max-width: 1200px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 40px;
            position: relative;
            
            /* Nova configuração: Carrega a imagem enviada como plano de fundo geral */
            background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('fundo-painel.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* Detalhes de Fundo Geométricos (Efeito de transição nas laterais) */
        .painel-container::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.05) 0%, transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .logo-rede {
            font-size: 28px;
            font-weight: 900;
            color: #1a365d;
            letter-spacing: -1px;
        }
        .logo-rede span {
            color: #3182ce;
            font-weight: 400;
        }

        .titulo-central {
            text-align: center;
            margin: 0 auto;
        }

        .titulo-central h1 {
            font-size: 36px;
            font-weight: 900;
            color: #0f2d59;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitulo {
            font-size: 14px;
            font-weight: 700;
            color: #27ae60;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitulo::before, .subtitulo::after {
            content: "";
            display: inline-block;
            width: 50px;
            height: 2px;
            background-color: #27ae60;
        }

        .badge-gptw {
            background-color: #cc0000;
            color: white;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            position: absolute;
            top: 0;
            right: 40px;
            z-index: 3;
        }

        /* Bloco dos Displays Numéricos */
        .conteudo-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        .display-box {
            background-color: #0b1a30;
            border: 4px solid #1e3a61;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .display-label {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .numero-digital {
            font-family: 'Orbitron', sans-serif;
            font-size: 130px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 5px;
        }

        /* Cores específicas dos LEDs */
        .led-vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.7);
        }

        .led-verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.7);
        }

        /* Rodapé com Informações */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(15, 45, 89, 0.1);
            padding-top: 20px;
            position: relative;
            z-index: 2;
        }

        .info-bloco {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icone {
            font-size: 28px;
        }

        .info-texto h2 {
            font-size: 24px;
            font-weight: 700;
            color: #0f2d59;
        }

        .info-texto p {
            font-size: 11px;
            color: #7c8ba1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .frase-efeito {
            font-size: 15px;
            font-weight: 700;
            color: #0f2d59;
            text-align: center;
            max-width: 250px;
            line-height: 1.3;
        }

        .logo-trilha {
            text-align: right;
        }

        .logo-trilha h3 {
            font-size: 22px;
            font-weight: 700;
            color: #27ae60;
            letter-spacing: 3px;
        }

        .logo-trilha p {
            font-size: 8px;
            color: #7c8ba1;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 20px; }
            .footer { flex-direction: column; gap: 20px; text-align: center; }
            .logo-trilha { text-align: center; }
            .numero-digital { font-size: 90px; }
            .subtitulo::before, .subtitulo::after { width: 20px; }
            .badge-gptw { position: relative; right: auto; top: auto; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="painel-container">
        
        <!-- Selo GPTW -->
        <div class="badge-gptw">
            Great<br>Place<br>To<br>Work.<br><span style="font-weight:400; font-size:9px;">Certificada</span>
        </div>

        <!-- Cabeçalho do Painel -->
        <header class="header">
            <div class="logo-rede">
                Re<span>De</span>
                <div style="font-size: 8px; font-weight: 700; color: #7c8ba1; letter-spacing: 0.5px; text-transform: uppercase; margin-top: -5px;">montagens eletromecânicas</div>
            </div>
            
            <div class="titulo-central">
                <h1>SEGURANÇA DO TRABALHO</h1>
                <div class="subtitulo">CUIDAR HOJE PARA PROTEGER SEMPRE</div>
            </div>
        </header>

        <!-- Seção dos Contadores -->
        <main class="conteudo-principal">
            
            <!-- Dias Sem Acidentes -->
            <div class="display-box">
                <div class="display-label">Dias Sem Acidentes</div>
                <div class="numero-digital led-vermelho" id="dias-sem-acidente">609</div>
            </div>

            <!-- Nosso Recorde -->
            <div class="display-box">
                <div class="display-label">Nosso Recorde</div>
                <div class="numero-digital led-verde" id="nosso-recorde">609</div>
            </div>

        </main>

        <!-- Rodapé de Informações -->
        <footer class="footer">
            
            <!-- Bloco de Data -->
            <div class="info-bloco">
                <span class="icone">📅</span>
                <div class="info-texto">
                    <h2 id="campo-data">27/07/2026</h2>
                    <p>Data</p>
                </div>
            </div>

            <!-- Frase Central -->
            <div class="frase-efeito">
                🛡️ SEGURANÇA É VALOR,<br>VIDA É PRIORIDADE
            </div>

            <!-- Bloco de Horário -->
            <div class="info-bloco">
                <span class="icone">🕒</span>
                <div class="info-texto">
                    <h2 id="campo-hora">08:43:17</h2>
                    <p>Horário</p>
                </div>
            </div>

            <!-- Logo Trilha -->
            <div class="logo-trilha">
                <h3>TRILHA</h3>
                <p>Estruturas Metálicas</p>
            </div>

        </footer>

    </div>

    <!-- Script para atualizar o relógio dinamicamente -->
    <script>
        function atualizarRelogio() {
            const agora = new Date();
            
            // Formatar Data (DD/MM/AAAA)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('campo-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Formatar Hora (HH:MM:SS)
            const horas = String(agora.getHours()).padStart(2, '0');
