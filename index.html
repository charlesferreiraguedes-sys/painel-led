<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- Fonte digital para os números do painel -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Ubuntu', sans-serif;
        }

        /* Container proporcional travado em 16:9 */
        .painel-fundo {
            width: 100vw;
            height: 100vh;
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16 / 9;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Máscaras pretas para cobrir os números antigos da imagem */
        .mascara-contador {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 16.5vh;
            background-color: #061325; /* Preto exato dos painéis */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        .posicao-vermelho {
            top: 23%;
        }

        .posicao-verde {
            top: 54.5%;
        }

        /* Estilo dos grandes números em LED */
        .contador-digital {
            font-family: 'Orbitron', sans-serif;
            font-size: 15vh; 
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
        }

        .led-vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.7);
        }

        .led-verde {
            color: #00ff66;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }

        /* Máscaras brancas para tapar os textos antigos do rodapé */
        .mascara-rodape {
            position: absolute;
            bottom: 12.2%;
            height: 5vh;
            background-color: #ffffff; /* Branco exato do rodapé */
            display: flex;
            align-items: center;
        }

        .posicao-data {
            left: 17%;
            width: 16%;
        }

        .posicao-hora {
            right: 11%;
            width: 15%;
            justify-content: flex-end;
        }

        /* Estilo dos textos dinâmicos do rodapé */
        .texto-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.5vh;
            font-weight: 700;
            color: #0d2343;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <!-- Blocos com fundo preto cobrindo os números antigos -->
        <div class="mascara-contador posicao-vermelho">
            <div class="contador-digital led-vermelho" id="num-dias">609</div>
        </div>
        
        <div class="mascara-contador posicao-verde">
            <div class="contador-digital led-verde" id="num-recorde">609</div>
        </div>

        <!-- Blocos com fundo branco cobrindo os textos do rodapé -->
        <div class="mascara-rodape posicao-data">
            <div class="texto-rodape" id="txt-data">27/07/2026</div>
        </div>
        
        <div class="mascara-rodape posicao-hora">
            <div class="texto-rodape" id="txt-hora">12:02:17</div>
        </div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualização da Data (DD/MM/AAAA)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualização do Relógio (HH:MM:SS)
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Mantém os dados atualizados a cada segundo
        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
