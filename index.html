<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2vw;
            overflow: hidden;
            font-family: 'Ubuntu', sans-serif;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 2.5vh;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 1.5vh 3vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            min-width: 45vw;
        }

        .caixa-titulo-preta h1 {
            font-size: 3.8vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
            margin-top: 0.5vh;
        }

        .linha-verde {
            width: 4vw;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-size: 1.8vh;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Placares Grandes Superiores */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 1vw;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 36vw;
            height: 28vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vh 1vw 1.5vh 1vw;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
        }

        .painel-contador h2 {
            color: #ffffff;
            font-size: 2.6vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 16vh;
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -2px;
            text-align: center;
            width: 100%;
            transform: scaleY(1.1);
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 25px rgba(255, 26, 26, 0.7);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }

        /* NOVO: Rodapé com Caixas Pretas Proporcionais lado a lado */
        .grid-rodape-caixas {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 1.5vw;
            padding: 0 1vw;
            margin-bottom: 1.5vh;
            z-index: 100;
        }

        .caixa-info-preta {
            background-color: #030d1a;
            border: 3px solid #142847;
            border-radius: 15px;
            flex: 1;
            height: 15vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1vh 0.5vw;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.4);
        }

        .caixa-info-preta p {
            font-size: 1.6vh;
            color: #a0b0c5;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5vh;
        }

        /* TAMANHO MÁXIMO DOS RESULTADOS: Letras pretas de alta definição digital */
        .resultado-texto-led {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 6.2vh;
            color: #ffffff; /* Ajustado para branco para brilhar dentro da caixa escura */
            font-weight: 700;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 170, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar Superior Lado a Lado -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div class="numero-digital verde">---</div>
            </div>
        </main>
    </div>

    <!-- MODIFICADO: Estrutura do rodapé dividida em 4 caixas eletrônicas proporcionais -->
    <footer class="grid-rodape-caixas">
        <div class="caixa-info-preta">
            <p>Semana Atual</p>
            <div class="resultado-texto-led">--ª Semana</div>
        </div>

        <div class="caixa-info-preta">
            <p>Data</p>
            <div class="resultado-texto-led">--/--/----</div>
        </div>

        <div class="caixa-info-preta">
            <p>Clima São Luís</p>
            <div class="resultado-texto-led">--°C</div>
        </div>

        <div class="caixa-info-preta">
            <p>Horário</p>
            <div class="resultado-texto-led">--:--:--</div>
        </div>
    </footer>

    <!-- SCRIPT BLINDADO: Sistema autônomo baseado em Varredura de Caractere Alvo -->
    <script>
        const DATA_INICIAL_CONTAGEM = new Date('2024-11-25T00:00:00');
        const DATA_BASE_34_SEMANA = new Date('2026-08-17T00:00:00');

        function rodarAtualizacoesPainel() {
            try {
                const agora = new Date();

                // 1. Geração dos dados dinâmicos de tempo
                const h = String(agora.getHours()).padStart(2, '0');
                const m = String(agora.getMinutes()).padStart(2, '0');
                const s = String(agora.getSeconds()).padStart(2, '0');
                const horaFormatada = `${h}:${m}:${s}`;

                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                const dataFormatada = `${dia}/${mes}/${ano}`;

                // 2. Cálculo dos dias corridos desde 25/11/2024
                const hojeZerado = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const dataInicZerada = new Date(DATA_INICIAL_CONTAGEM.getFullYear(), DATA_INICIAL_CONTAGEM.getMonth(), DATA_INICIAL_CONTAGEM.getDate());
                const diferencaTempo = hojeZerado.getTime() - dataInicZerada.getTime();
                const diasCalculados = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));

                // 3. Cálculo da semana atual (Vira de domingo para segunda)
                const baseSegundaZerada = new Date(DATA_BASE_34_SEMANA.getFullYear(), DATA_BASE_34_SEMANA.getMonth(), DATA_BASE_34_SEMANA.getDate());
                const diferencaSemanasTempo = hojeZerado.getTime() - baseSegundaZerada.getTime();
                const semanasPassadas = Math.floor(diferencaSemanasTempo / (1000 * 60 * 60 * 24 * 7));
                const semanaCalculada = 34 + semanasPassadas;

                // 4. Varredura Universal Cega: Atualiza varrendo o texto sem depender das IDs antigas
                const elementosTexto = document.querySelectorAll('.numero-digital, .resultado-texto-led');
                
                elementosTexto.forEach(el => {
                    let textoOriginal = el.textContent.trim();

                    if (textoOriginal === '---') {
                        el.textContent = diasCalculados;
                    } else if (textoOriginal.includes('--:--') || (textoOriginal.includes(':') && textoOriginal.length <= 9)) {
                        el.textContent = horaFormatada;
                    } else if (textoOriginal.includes('--/--') || (textoOriginal.includes('/') && textoOriginal.length <= 11)) {
                        el.textContent = dataFormatada;
                    } else if (textoOriginal.includes('--ª') || textoOriginal.includes('Semana')) {
                        el.textContent = `${semanaCalculada}ª Semana`;
                    }
                });
