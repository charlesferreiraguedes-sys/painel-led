<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <!-- Importação de fontes: Share Tech Mono para emular perfeitamente o LED digital de 7 segmentos de relógio industrial -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Share+Tech+Mono&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .painel-fundo {
            width: 100vw;
            height: 100vh;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Alargado de 53.3% para 54.3% e expandido totalmente para o lado direito */
        .conteudo-displays {
            position: absolute;
            top: 17%;
            left: 23.35%;
            width: 54.3%;
            height: 61.8vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .quadro-display {
            width: 100%;
            height: 29.5vh;
            background-color: #061325;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2.2vh 0 1vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .borda-vermelha {
            border: 3.5px solid #0f243d;
        }

        .borda-verde {
            border: 3.5px solid #08221a;
        }

        .titulo-interno {
            color: #ffffff;
            font-size: 2.6vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Estilo calibrado para números digitais de relógio industrial */
        .contador-led {
            font-family: 'Share Tech Mono', monospace;
            font-size: 22vh; 
            font-weight: 700;
            letter-spacing: 6px; /* Espaçamento entre os caracteres digitais */
            line-height: 0.85;
            text-align: center;
            width: 100%;
        }

        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 20px rgba(255, 17, 34, 0.6);
        }

        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 20px rgba(0, 255, 85, 0.6);
        }

        /* Estilo comum para os blocos de texto do rodapé com fundo cinza-claro */
        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.2vh;
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 12.5%;
            line-height: 1;
            background-color: #f4f5f7; /* Cor cinza-claro idêntica ao fundo do rodapé */
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* Alinhamento sobre a tag DATA */
        .posicao-data {
            left: 19.1%;
        }

        /* Alinhamento sobre a tag HORÁRIO */
        .posicao-hora {
            right: 13.5%;
        }
    </style>
</head>
<body>

    <div class="painel-fundo">
        
        <div class="conteudo-displays">
            
            <!-- Quadro Dias Sem Acidentes -->
            <div class="quadro-display borda-vermelha">
                <div class="titulo-interno">Dias Sem Acidentes</div>
                <div class="contador-led led-vermelho" id="num-dias">609</div>
            </div>
            
            <!-- Quadro Nosso Recorde -->
            <div class="quadro-display borda-verde">
                <div class="titulo-interno">Nosso Recorde</div>
                <div class="contador-led led-verde" id="num-recorde">609</div>
            </div>

        </div>

        <!-- Informações dinâmicas do rodapé protegidas com fundo cinza -->
        <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
        <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">12:44:30</div>

    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            // Atualiza a Data (DD/MM/AAAA)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            // Atualiza o Horário (HH:MM:SS)
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        setInterval(atualizarPainel, 1000);
        atualizarPainel();
    </script>
</body>
</html>
