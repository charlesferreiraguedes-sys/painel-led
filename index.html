<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 20px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 480px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* MODIFICADO: Fonte alterada para Arial e tamanho maximizado */
        .numero-digital {
            font-family: 'Arial', sans-serif;
            font-size: 12rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* MODIFICADO: Rodapé estruturado com caixas pretas proporcionais lado a lado */
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 0;
            gap: 20px;
        }

        .caixa-info-preta-rodape {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            flex: 1;
            height: 16vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px 10px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .caixa-info-preta-rodape p {
            font-family: 'Arial', sans-serif;
            font-size: 1.3rem;
            color: #a2b4c7;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* MODIFICADO: Resultados em tamanho máximo absoluto dentro das caixas */
        .resultado-gigante-rodape {
            font-family: 'Arial', sans-serif;
            font-size: 5.2vh;
            color: #ffffff; 
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar com Contagem Automática -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>

    </div>

    <!-- MODIFICADO: Rodapé com caixas pretas estruturadas lado a lado -->
    <footer>
        <div class="caixa-info-preta-rodape">
            <p>Semana Atual</p>
            <div id="semana-campo" class="resultado-gigante-rodape">34ª Semana</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Data</p>
            <div id="data-campo" class="resultado-gigante-rodape">--/--/----</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>São Luís - MA</p>
            <div id="temp-campo" class="resultado-gigante-rodape">--°C</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Horário</p>
            <div id="relogio-campo" class="resultado-gigante-rodape">--:--:--</div>
        </div>
    </footer>

    <!-- Scripts de Atualização Autônomos Corrigidos -->
    <script>
        function calcularDias() {
            try {
                const dataInicial = new Date(2024, 10, 25); // 25/11/2024
                const dataAtual = new Date();
                
                dataInicial.setHours(0, 0, 0, 0);
                dataAtual.setHours(0, 0, 0, 0);
                
                const diferencaTempo = dataAtual.getTime() - dataInicial.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
                
                if (diferencaDias >= 0) {
                    document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                    document.getElementById('nosso-recorde').textContent = diferencaDias;
                }
            } catch (e) { console.error(e); }
        }

        function calcularSemanas() {
            try {
                const dataAtual = new Date();
                const dataBaseSegunda = new Date(2026, 7, 17); // Segunda-feira da 34ª semana
                dataBaseSegunda.setHours(0, 0, 0, 0);
                
                const hoje = new Date(dataAtual.getTime());
                hoje.setHours(0, 0, 0, 0);
                
                const diferencaTempo = hoje.getTime() - dataBaseSegunda.getTime();
                const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
                
                const semanasPassadas = Math.floor(diferencaDias / 7);
                const semanaAtual = 34 + semanasPassadas;
                
                document.getElementById('semana-campo').textContent = `${semanaAtual}ª Semana`;
            } catch (e) { console.error(e); }
        }

        function atualizarPainel() {
            try {
                const agora = new Date();
                
                // Relógio ativo segundo a segundo
                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0');
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;
                
                // Data atualizada dinamicamente
                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;
                
                atualizarClimaSimulado(agora.getHours());
            } catch (e) { console.error(e); }
        }

                let temperatura = 27; 
                
                if (horaAtual >= 0 && horaAtual < 6) {
                    temperatura = 25; 
                } else if (horaAtual >= 6 && horaAtual < 9) {
                    temperatura = 27; 
                } else if (horaAtual >= 9 && horaAtual < 15) {
