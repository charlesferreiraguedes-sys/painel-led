<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px; /* Margem lateral ajustada para o alinhamento dos cantos */
            color: #0c2340;
            overflow: hidden;
        }

        /* Container que agrupa o Título e o Placar Aberto */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px; /* Distância ideal mantendo a proximidade vertical */
            margin-top: 20px;
            width: 100%;
        }

        /* Caixa de Título Preta Centralizada */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #142847;
            padding: 12px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.4);
            width: 700px;
        }

        .caixa-titulo-preta h1 {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitulo {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff66;
            letter-spacing: 3px;
            margin-top: 3px;
        }

        /* Placar Afastado para as Extremidades Esquerda e Direita */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between; /* Empurra uma caixa para cada extremidade lateral */
            align-items: center;
            width: 100%; /* Ocupa a largura total disponível da tela */
            max-width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 480px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            color: #ffffff;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé Ampliado */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px 50px;
            border: 3px solid #0c2340;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        .bloco-info {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .icone {
            font-size: 4rem;
        }

        .texto-info p {
            font-size: 1.3rem;
            color: #5d6d7e;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .texto-info h3 {
            font-size: 2.8rem;
            color: #0c2340;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <!-- Bloco Centralizado Superior -->
    <div class="container-principal">
        
        <!-- Caixa de Título Centralizada -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo">CUIDAR HOJE PARA PROTEGER SEMPRE</div>
        </header>

        <!-- Placar com Caixas nas Margens Opostas -->
        <main class="grid-contadores">
            <!-- Dias Sem Acidentes (Encostado na Esquerda) -->
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div class="numero-digital vermelho">611</div>
            </div>

            <!-- Nosso Recorde (Encostado na Direita) -->
            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div class="numero-digital verde">611</div>
            </div>
        </main>

    </div>

    <!-- Rodapé Mantido com Tamanho Dobrado e Temperatura -->
    <footer>
        <!-- Data -->
        <div class="bloco-info">
            <div class="icone">📅</div>
            <div class="texto-info">
                <p>Data</p>
                <h3 id="data-campo">29/07/2026</h3>
            </div>
        </div>

        <!-- Temperatura -->
        <div class="bloco-info">
            <div class="icone">☀️</div>
            <div class="texto-info">
                <p>São Luís - MA</p>
                <h3 id="temp-campo">28°C</h3>
            </div>
        </div>

        <!-- Horário -->
        <div class="bloco-info">
            <div class="icone">🕒</div>
            <div class="texto-info">
                <p>Horário</p>
                <h3 id="relogio-campo">09:04:00</h3>
            </div>
        </div>
    </footer>

    <!-- Scripts de Atualização Automática -->
    <script>
        function atualizarPainel() {
            const agora = new Date();
            
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutes = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('relogio-campo').textContent = `${horas}:${minutes}:${segundos}`;
            
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;
        }

        async function buscarTemperaturaOnline() {
            try {
                const response = await fetch('https://open-meteo.com');
                const data = await response.json();
                if (data && data.current_weather) {
                    const tempArredondada = Math.round(data.current_weather.temperature);
                    document.getElementById('temp-campo').textContent = `${tempArredondada}°C`;
                }
            } catch (error) {
                console.log("Erro ao carregar dados de temperatura.");
            }
        }

        setInterval(atualizarPainel, 1000);
        atualizarPainel();
        buscarTemperaturaOnline();
        setInterval(buscarTemperaturaOnline, 900000);
    </script>

</body>
</html>
