<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Segurança do Trabalho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url('URL_DA_SUA_SEGUNDA_FOTO.jpg'); /* Substitua pelo caminho real da imagem */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vh 2vw;
            overflow: hidden;
        }

        /* Container Superior */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 3vh;
            width: 100%;
            margin-top: 15vh; /* Moveu todo o bloco superior para baixo uniformemente */
        }

        /* Caixa de Título Preta */
        .caixa-titulo-preta {
            background-color: #000000;
            border: 2px solid #112233;
            padding: 1.5vh 4vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: auto;
            min-width: 800px;
        }

        .caixa-titulo-preta h1 {
            font-family: 'Arial', sans-serif;
            font-size: 4.5vh;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 0.5vh;
        }

        .linha-verde {
            width: 80px;
            height: 3px;
            background-color: #006437;
        }

        .subtitulo-texto {
            font-family: 'Arial', sans-serif;
            font-size: 2vh;
            font-weight: 900;
            color: #ffffff; 
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Placar nas Extremidades */
        .grid-contadores {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .painel-contador {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            width: 44vw;
            height: 32vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5vh 15px 1.5vh 15px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .painel-contador h2 {
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            font-size: 3vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .numero-digital {
            font-family: 'Arial', sans-serif;
            font-size: 12rem;
            font-weight: bold;
            line-height: 1;
        }

        .vermelho {
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
        }

        .verde {
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Rodapé de Caixas Pretas */
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: transparent;
            padding: 1vh 0;
            gap: 1.5vw;
        }

        .caixa-info-preta-rodape {
            background-color: #030d1a;
            border: 4px solid #142847;
            border-radius: 20px;
            flex: 1;
            height: 16vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5vh 10px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        .caixa-info-preta-rodape p {
            font-family: 'Arial', sans-serif;
            font-size: 1.8vh;
            color: #ffffff; 
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5vh;
            letter-spacing: 1px;
        }

        .resultado-gigante-rodape {
            font-family: 'Arial', sans-serif;
            font-size: 6.2vh;
            color: #ffffff; 
            font-weight: 900;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>

    <!-- Bloco Superior -->
    <div class="container-principal">
        <!-- Título -->
        <header class="caixa-titulo-preta">
            <h1>Segurança do Trabalho</h1>
            <div class="subtitulo-container">
                <div class="linha-verde"></div>
                <div class="subtitulo-texto">Cuidar Hoje para Proteger Sempre</div>
                <div class="linha-verde"></div>
            </div>
        </header>

        <!-- Placar Eletrônico -->
        <main class="grid-contadores">
            <div class="painel-contador">
                <h2>Dias Sem Acidentes</h2>
                <div id="dias-sem-acidente" class="numero-digital vermelho">---</div>
            </div>

            <div class="painel-contador">
                <h2>Nosso Recorde</h2>
                <div id="nosso-recorde" class="numero-digital verde">---</div>
            </div>
        </main>
    </div>

    <!-- Rodapé Automatizado -->
    <footer>
        <div class="caixa-info-preta-rodape">
            <p>Semana Atual</p>
            <div id="semana-campo" class="resultado-gigante-rodape">--ª Semana</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Data</p>
            <div id="data-campo" class="resultado-gigante-rodape">--/--/----</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>São Luís - MA</p>
            <div id="temp-campo" class="resultado-gigante-rodape">--°C</div>
        </div>

        <div class="caixa-info-preta-rodape">
            <p>Horário</p>
            <div id="relogio-campo" class="resultado-gigante-rodape">--:--:--</div>
        </div>
    </footer>

    <script>
        // 1. Função base interna (Roda imediatamente sem depender de servidores de terceiros)
        function rodarPainelCompleto() {
            try {
                const agora = new Date();
                
                // Relógio atualizado segundo a segundo
                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0');
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                document.getElementById('relogio-campo').textContent = `${horas}:${minutos}:${segundos}`;
                
                // Data corrente
                const dia = String(agora.getDate()).padStart(2, '0');
                const mes = String(agora.getMonth() + 1).padStart(2, '0');
                const ano = agora.getFullYear();
                document.getElementById('data-campo').textContent = `${dia}/${mes}/${ano}`;
                
                // Dias Sem Acidente e Recorde baseados em 25/11/2024
                const dataInicial = new Date(2024, 10, 25);
                dataInicial.setHours(0, 0, 0, 0);
                const hojeZerado = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const diferencaDias = Math.floor((hojeZerado.getTime() - dataInicial.getTime()) / (1000 * 60 * 60 * 24));
                
                if (diferencaDias >= 0) {
                    document.getElementById('dias-sem-acidente').textContent = diferencaDias;
                    document.getElementById('nosso-recorde').textContent = diferencaDias;
                }

                // Contador de semanas (Base fixa: 17/08/2026 = 34ª Semana)
                const dataBaseSegunda = new Date(2026, 7, 17);
                dataBaseSegunda.setHours(0, 0, 0, 0);
                const diferencaIdadeSemanas = Math.floor((hojeZerado.getTime() - dataBaseSegunda.getTime()) / (1000 * 60 * 60 * 24 * 7));
                const semanaAtual = 34 + diferencaIdadeSemanas;
                document.getElementById('semana-campo').textContent = `${semanaAtual}ª Semana`;

            } catch (e) { console.error("Erro na automação de tempo do painel:", e); }
        }

        // 2. Função isolada do Clima em tempo real (Usa fetch tradicional para não interceptar erros globais)
        function atualizarClimaReal() {
            const url = "https://open-meteo.com";
            
            fetch(url)
                .then(resposta => {
                    if (!resposta.ok) throw new Error();
                    return resposta.json();
                })
                .then(dados => {
                    if (dados && dados.current_weather) {
                        const tempReal = Math.round(dados.current_weather.temperature);
                        document.getElementById('temp-campo').textContent = `${tempReal}°C`;
                    }
                })
                .catch(erro => {
                    console.error("Erro ao buscar temperatura da API, usando estimativa de fallback.");
