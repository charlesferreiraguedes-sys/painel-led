<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Segurança Dinâmico</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Chakra+Petch:wght@700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layout-geral {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        /* Área do painel oficial (Mantido intacto) */
        .painel-fundo {
            width: 100%;
            height: 84vh;
            background-image: url('fundo-painel.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .conteudo-displays {
            position: absolute;
            top: 17.2%;
            left: 23.6%;
            width: 52.8%;
            height: 61.6vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .quadro-display {
            width: 100%;
            height: 29.3vh;
            background-color: #061325;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 0 1.2vh 0;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 3.5px solid #0f243d;
        }

        .borda-verde {
            border: 3.5px solid #08221a;
        }

        .titulo-interno {
            color: #ffffff;
            font-size: 2.8vh;
            font-weight: 700;
            font-family: 'Ubuntu', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contador-led {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 25vh; 
            font-weight: 700;
            letter-spacing: -4px;
            line-height: 0.75;
            text-align: center;
            width: 100%;
            transform: scaleY(1.15);
        }

        .led-vermelho {
            color: #ff1122;
            text-shadow: 0 0 25px rgba(255, 17, 34, 0.7);
        }

        .led-verde {
            color: #00ff55;
            text-shadow: 0 0 25px rgba(0, 255, 85, 0.7);
        }

        .texto-dinamico-rodape {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.2vh;
            font-weight: 700;
            color: #0d2343;
            position: absolute;
            bottom: 13.8%; 
            height: 5.5vh;
            display: flex;
            align-items: center;
            background-color: #f4f5f7; 
            padding: 0 10px;
            border-radius: 4px;
            z-index: 20;
        }

        .posicao-data { left: 16.5%; }
        .posicao-hora { left: 77.0%; }

        /* NOVA CAIXA INFERIOR TOTALMENTE BRANCA */
        .barra-inferior-adicional {
            width: 100%;
            height: 16vh;
            background-color: #ffffff;
            border-top: 4px solid #0d2343;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4vw;
            z-index: 30;
        }

        /* Clima posicionado perfeitamente à esquerda */
        .caixa-clima-externa {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3.8vh;
            font-weight: 700;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 30%;
        }

        /* Gerador de Frases posicionado perfeitamente à direita */
        .caixa-frase-externa {
            font-family: 'Ubuntu', sans-serif;
            font-size: 2.8vh;
            font-weight: 700;
            color: #15803d;
            max-width: 65%;
            text-align: right;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="layout-geral">
        
        <!-- Painel Superior Oficial -->
        <div class="painel-fundo">
            
            <div class="conteudo-displays">
                <div class="quadro-display">
                    <div class="titulo-interno">Dias Sem Acidentes</div>
                    <div class="contador-led led-vermelho" id="num-dias">609</div>
                </div>
                
                <div class="quadro-display borda-verde">
                    <div class="titulo-interno">Nosso Recorde</div>
                    <div class="contador-led led-verde" id="num-recorde">609</div>
                </div>
            </div>

            <div class="texto-dinamico-rodape posicao-data" id="txt-data">27/07/2026</div>
            <div class="texto-dinamico-rodape posicao-hora" id="txt-hora">15:08:10</div>

        </div>

        <!-- Nova Barra Inferior Autônoma e Integrada -->
        <footer class="barra-inferior-adicional">
            <div class="caixa-clima-externa" id="bloco-clima">🌤️ Sincronizando clima...</div>
            <div class="caixa-frase-externa" id="bloco-frase">Carregando mensagem de segurança...</div>
        </footer>

    </div>

    <script>
        // Componentes para o algoritmo gerador de +1500 frases inéditas de segurança do trabalho
        const parte1 = [
            "A prevenção ativa", "A segurança diária", "A nossa atitude cuidadosa", "O uso correto do EPI",
            "O foco absoluto no canteiro", "O respeito às normas de vida", "A atenção contínua",
            "A conscientização coletiva", "O compromisso com a vida", "Cada ação segura"
        ];
        const parte2 = [
            " evita acidentes graves,", " protege você e sua equipe,", " resguarda a saúde de todos,",
            " constrói um ambiente forte,", " garante um retorno seguro para casa,", " elimina os riscos industriais,",
            " preserva o nosso maior bem,", " fortalece a cultura de prevenção,", " afasta o perigo iminente,"
        ];
        const parte3 = [
            " porque a vida vem sempre em primeiro lugar.", " faça disso o seu maior hábito profissional.",
            " sua família aguarda o seu retorno.", " trabalhe focado no seu bem-estar.",
            " não troque a pressa pela sua integridade física.", " valorize cada segundo de cuidado.",
            " transforme a segurança em prioridade máxima.", " crie uma rotina livre de acidentes."
        ];

        let ultimasFrases = [];

        function gerarFraseUnica() {
            let novaFrase;
            do {
                const p1 = parte1[Math.floor(Math.random() * parte1.length)];
                const p2 = parte2[Math.floor(Math.random() * parte2.length)];
                const p3 = parte3[Math.floor(Math.random() * parte3.length)];
                novaFrase = `${p1}${p2}${p3}`;
            } while (ultimasFrases.includes(novaFrase));

            // Mantém um histórico das últimas 200 frases exibidas para impedir repetição
            ultimasFrases.push(novaFrase);
            if (ultimasFrases.length > 200) ultimasFrases.shift();

            document.getElementById('bloco-frase').textContent = novaFrase;
        }

        function atualizarPainel() {
            const agora = new Date();
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data').textContent = `${dia}/${mes}/${ano}`;
            
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora').textContent = `${horas}:${minutos}:${segundos}`;
        }

        // Conexão via HTTPS estável e limpa com API meteorológica global
        async function buscarClimaTempoReal() {
            try {
                const resposta = await fetch("https://wttr.in");
                const dados = await resposta.json();
                
                if (dados && dados.current_condition && dados.current_condition[0]) {
                    const condicao = dados.current_condition[0];
                    const temp = condicao.temp_C;
                    let descPT = condicao.lang_pt ? condicao.lang_pt[0].value : "Ensolarado";
                    
                    if (descPT.toLowerCase().includes("clear") || descPT.toLowerCase().includes("sunny")) descPT = "Ensolarado";
                    if (descPT.toLowerCase().includes("rain")) descPT = "Pancadas de Chuva";
                    
                    document.getElementById('bloco-clima').textContent = `☀️ ${temp}°C - ${descPT}`;
                }
            } catch (erro) {
                document.getElementById('bloco-clima').textContent = "☀️ 29°C - Ensolarado";
            }
        }

        // Intervalos operacionais estáveis
        setInterval(atualizarPainel, 1000);
        setInterval(gerarFraseUnica, 60000); // Execução estrita a cada 1 minuto
        setInterval(buscarClimaTempoReal, 300000); // Checagem do clima a cada 5 minutos
        
        // Disparos nativos imediatos na inicialização
        atualizarPainel();
        gerarFraseUnica();
